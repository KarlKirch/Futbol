<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOD parandus</title><style>body{margin:0;font-family:system-ui;background:#f2f5f3;color:#172019}.wrap{min-height:100svh;display:grid;place-items:center;padding:24px}.card{max-width:420px;background:#fff;border:1px solid #dce5df;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0001}.ok{color:#176b43;font-weight:800}.bad{color:#a93232;font-weight:800}</style></head><body><div class="wrap"><div class="card"><h2>WOD paranduse käivitamine</h2><p id="msg">Uuendan Futboli taustateenust…</p></div></div><script>(async()=>{const m=document.getElementById('msg');try{if(!('serviceWorker'in navigator)){m.innerHTML='<span class="bad">Service workerit ei leitud.</span>';return;}let reg=await navigator.serviceWorker.getRegistration('./');if(!reg){reg=await navigator.serviceWorker.register('./sw.js?v=12',{scope:'./',updateViaCache:'none'});}else{reg=await navigator.serviceWorker.register('./sw.js?v=12',{scope:'./',updateViaCache:'none'});await reg.update().catch(()=>{});}const go=()=>{location.replace('./wod/?v=5');};if(reg.installing||reg.waiting){const w=reg.installing||reg.waiting;w.addEventListener('statechange',()=>{if(w.state==='activated'){m.innerHTML='<span class="ok">Parandus tehtud. Avan WOD-i…</span>';setTimeout(go,500);}});setTimeout(go,3000);}else{m.innerHTML='<span class="ok">Parandus tehtud. Avan WOD-i…</span>';setTimeout(go,700);}}catch(e){m.innerHTML='<span class="bad">Parandus ebaõnnestus: '+String(e.message||e)+'</span>';}})();</script></body></html>
