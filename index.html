<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251b">

  <title>Futbol</title>
<link rel="icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --dark: #10251b;
      --green: #176b43;
      --green2: #238653;
      --green-soft: #e8f4ed;
      --text: #172019;
      --muted: #68746c;
      --border: #dce5df;
      --danger: #a93232;
      --warning: #8b6516;
      --shadow: 0 5px 20px rgba(20, 40, 28, 0.07);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding-bottom: 85px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      background: var(--dark);
      color: white;
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        16px;
    }

    .topbar-inner {
      max-width: 720px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .player-label {
      color: #cddbd2;
      font-size: 11px;
      text-align: right;
    }

    #currentPlayer {
      text-align: right;
      font-weight: 800;
    }

    main {
      width: min(720px, 100%);
      margin: auto;
      padding: 16px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .welcome {
      max-width: 470px;
      margin: 48px auto 0;
      text-align: center;
    }

    .welcome-logo {
      font-size: 38px;
      font-weight: 950;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.5;
    }

    .input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #cbd6cf;
      border-radius: 12px;
      background: white;

    }

    .input:focus,
    .score-input:focus {

    .btn-small {

    .btn-secondary {

    .btn-danger {

    }

    .player-summary {

      font-size: 14px;
      white-space: nowrap;

    .num {

    .rank {

      font-weight: 950;
    }

    .leader {
      font-weight: 900;
    }

    .form-grid {
      display: grid;
      gap: 11px;

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;

    .date-picker-row {

      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: end;

    .calendar-trigger {

      border: 1px solid var(--border);
      border-radius: 12px;

      cursor: pointer;
      box-shadow: var(--shadow);

    .calendar-trigger:active {
      transform: translateY(1px);

    .calendar-native {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      opacity: 0;
      pointer-events: none;
    }

    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf1ee;
    }

    .user-row:last-child {
      border-bottom: 0;

      color: var(--muted);

      font-weight: 800;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .admin-panel {

      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .error {
      margin-top: 9px;
      color: var(--danger);
      font-size: 13px;
    }

    #toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      border-radius: 12px;
      background: #17241c;
      color: white;
      box-shadow: var(--shadow);
      font-size: 14px;
      text-align: center;
    }

    .loading {

    @media (min-width: 600px) {

        padding-top: 24px;

      }

      .score-entry {

      }
    }
  </style>
</head>

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function toast(message) {

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.classList.add("hidden");
  }, 2800);

function friendlyError(error) {

  const msg = String(error?.message || error || "");

  if (msg.includes("Ennustamine on lõppenud")) {
    return "Ennustamine on selleks mänguks lõppenud.";

  }

function formatDate(timestamp) {

  return new Intl.DateTimeFormat(
    "et-EE",
    {
      timeZone: "Europe/Tallinn",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  ).format(new Date(timestamp));
}

function formatTime(timestamp) {

  return new Intl.DateTimeFormat(
    "et-EE",
    {
      timeZone: "Europe/Tallinn",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(new Date(timestamp));
}

function tallinnParts(timestamp) {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Europe/Tallinn",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }
    ).formatToParts(new Date(timestamp));

  const result = {};

  parts.forEach(part => {
    result[part.type] = part.value;
  });

  return result;
}

function isoToTallinnInput(timestamp) {

  const p = tallinnParts(timestamp);

  return (
    p.year + "-" +
    p.month + "-" +
    p.day + "T" +
    p.hour + ":" +
    p.minute
  );
}

function tallinnLocalToIso(value) {

  if (!value) {
    return null;
  }

  const parts = value.split("T");

  const date = parts[0].split("-").map(Number);
  const time = parts[1].split(":").map(Number);

  const target = Date.UTC(
    date[0],
    date[1] - 1,
    date[2],
    time[0],
    time[1],
    0
  );

  let guess = target;

  for (let i = 0; i < 4; i++) {

    const p =
      tallinnParts(
        new Date(guess).toISOString()
      );

    const rendered = Date.UTC(
      Number(p.year),
      Number(p.month) - 1,
      Number(p.day),
      Number(p.hour),
      Number(p.minute),
      0
    );

    guess += target - rendered;
  }

  return new Date(guess).toISOString();
}

function formatEuropeanDateInput(input) {

  const digits = input.value.replace(/\D/g, "").slice(0, 8);

  if (digits.length <= 2) {
    input.value = digits;
  } else if (digits.length <= 4) {
    input.value = digits.slice(0, 2) + "." + digits.slice(2);
  } else {
    input.value =
      digits.slice(0, 2) + "." +
      digits.slice(2, 4) + "." +
      digits.slice(4);
  }
}

function formatEuropeanTimeInput(input) {

  const digits = input.value.replace(/\D/g, "").slice(0, 4);

  if (digits.length <= 2) {
    input.value = digits;
  } else {
    input.value = digits.slice(0, 2) + ":" + digits.slice(2);
  }
}

function europeanKickoffToIso(dateValue, timeValue) {

  const dateMatch = String(dateValue || "").trim()
    .match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  const timeMatch = String(timeValue || "").trim()
    .match(/^(\d{2}):(\d{2})$/);

  if (!dateMatch || !timeMatch) {
    return null;
  }

  const day = Number(dateMatch[1]);
  const month = Number(dateMatch[2]);
  const year = Number(dateMatch[3]);
  const hour = Number(timeMatch[1]);
  const minute = Number(timeMatch[2]);

  if (
    year < 2000 ||
    month < 1 || month > 12 ||
    day < 1 || day > 31 ||
    hour < 0 || hour > 23 ||
    minute < 0 || minute > 59
  ) {
    return null;
  }

  const testDate = new Date(Date.UTC(year, month - 1, day));

  if (
    testDate.getUTCFullYear() !== year ||
    testDate.getUTCMonth() !== month - 1 ||
    testDate.getUTCDate() !== day
  ) {
    return null;
  }

  const local =
    String(year).padStart(4, "0") + "-" +
    String(month).padStart(2, "0") + "-" +
    String(day).padStart(2, "0") + "T" +
    String(hour).padStart(2, "0") + ":" +
    String(minute).padStart(2, "0");

  return tallinnLocalToIso(local);
}

function europeanDateToNative(value) {

  const match = String(value || "").trim()
    .match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  if (!match) {
    return "";
  }

  return match[3] + "-" + match[2] + "-" + match[1];
}

function nativeDateToEuropean(value) {

  const match = String(value || "").trim()
    .match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (!match) {
    return "";
  }

  return match[3] + "." + match[2] + "." + match[1];
}

function openDatePicker(nativeId, textId) {

  const nativeInput = document.getElementById(nativeId);
  const textInput = document.getElementById(textId);

  if (!nativeInput || !textInput) {
    return;
  }

  const nativeValue = europeanDateToNative(textInput.value);
  if (nativeValue) {
    nativeInput.value = nativeValue;
  }

  try {
    if (typeof nativeInput.showPicker === "function") {
      nativeInput.showPicker();
    } else {
      nativeInput.focus();
      nativeInput.click();
    }
  } catch (error) {
    nativeInput.focus();
    nativeInput.click();
  }
}

function syncDateFromPicker(nativeId, textId) {

  const nativeInput = document.getElementById(nativeId);
  const textInput = document.getElementById(textId);

  if (!nativeInput || !textInput || !nativeInput.value) {
    return;
  }

  textInput.value = nativeDateToEuropean(nativeInput.value);
}

function isStarted(match) {

  return (
    Date.now() >=
    new Date(match.kickoff_at).getTime()
  );
}

function isFinished(match) {

  return (
    match.home_score !== null &&
    match.home_score !== undefined &&
    match.away_score !== null &&
    match.away_score !== undefined
  );
}

function playerName(id) {

  const player =
    players.find(p => p.id === id);

  return player
    ? player.display_name
    : "Mängija";
}

function calculatePoints(prediction, match) {

  if (!isFinished(match)) {
    return null;
  }

  const ph = Number(prediction.home_score);
  const pa = Number(prediction.away_score);

  const ah = Number(match.home_score);
  const aa = Number(match.away_score);

  if (ph === ah && pa === aa) {
    return 3;
  }

  if (ph > pa && ah > aa) {
    return 1;
  }

  if (ph < pa && ah < aa) {
    return 1;
  }

  if (ph === pa && ah === aa) {
    return 1;
  }

  return 0;
}

async function init() {

  try {

    if (
      SUPABASE_URL.includes("SINU_") ||
      SUPABASE_KEY.includes("SINU_")
    ) {
      throw new Error(
        "Supabase URL või Publishable key on index.html failis veel sisestamata."
      );
    }

    const sessionResult =
      await sb.auth.getSession();

    if (sessionResult.error) {
      throw sessionResult.error;
    }

    let session =
      sessionResult.data.session;

    if (!session) {

      const signIn =
        await sb.auth.signInAnonymously();

      if (signIn.error) {
        throw signIn.error;
      }

      session =
        signIn.data.session;
    }

    currentUser =
      session.user;

    const playerResult =
      await sb
        .from("players")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (playerResult.error) {
      throw playerResult.error;
    }

    currentPlayer =
      playerResult.data;

    document
      .getElementById("loadingScreen")
      .classList.add("hidden");

    if (!currentPlayer) {

      document
        .getElementById("nameGate")
        .classList.remove("hidden");

      return;
    }

    await enterApp();

  } catch (error) {

    document
      .getElementById("loadingScreen")
      .innerHTML =
      '<main><div class="card">' +
      "<h2>Futboli käivitamine ebaõnnestus</h2>" +
      '<div class="error">' +
      esc(friendlyError(error)) +
      "</div></div></main>";
  }
}

async function loadAll() {

  const matchResult =
    await sb
      .from("matches")
      .select("*");

  if (matchResult.error) {

    toast(
      friendlyError(matchResult.error)
    );

    return;
  }

  matches =
    matchResult.data || [];

  matches.sort((a, b) => {

    const aStarted = isStarted(a);
    const bStarted = isStarted(b);

    if (aStarted !== bStarted) {
      return aStarted ? 1 : -1;
    }

    if (!aStarted) {
      return (
        new Date(a.kickoff_at) -
        new Date(b.kickoff_at)
      );
    }

    return (
      new Date(b.kickoff_at) -
      new Date(a.kickoff_at)
    );
  });

  const playerResult =
    await sb
      .from("players")
      .select("id,display_name");

  if (!playerResult.error) {
    players = playerResult.data || [];
  }

  const predictionResult =
    await sb
      .from("predictions")
      .select("*");

  if (!predictionResult.error) {
    predictions =
      predictionResult.data || [];
  }

  const boardResult =
    await sb.rpc(
      "get_leaderboard"
    );

  if (!boardResult.error) {

    leaderboard =
      boardResult.data || [];
  }

  renderPlayerSummary();
  renderGames();
  renderLeaderboard();

  if (adminVerified) {
    renderAdmin();
  }
}

async function shareFutbol() {

  const shareData = {
    title: "Futbol",
    text: "Tule ennusta meiega jalgpallimängude skoore!",
    url: futbolShareUrl()
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
      return;
    }

    if (navigator.clipboard) {
      await navigator.clipboard.writeText(futbolShareUrl());
      toast("Futboli link kopeeritud.");
      return;
    }

    window.prompt("Kopeeri Futboli link:", futbolShareUrl());
  } catch (error) {
    if (error && error.name === "AbortError") {
      return;
    }

    toast("Lingi jagamine ebaõnnestus.");
  }
}

function futbolShareUrl() {
  return window.location.origin + window.location.pathname;
}

function futbolShareText() {
  return "Tule ennusta meiega jalgpallimängude skoore!";
}

async function copyFutbolLink(showMessage = true) {

  const url = futbolShareUrl();

  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
    } else {
      window.prompt("Kopeeri Futboli link:", url);
      return;
    }

    if (showMessage) {
      toast("Futboli link kopeeritud.");
    }
  } catch (error) {
    window.prompt("Kopeeri Futboli link:", url);
  }
}

async function shareViaApp(app) {

  const url = futbolShareUrl();
  const message = futbolShareText();
  const combined = message + " " + url;

  if (app === "whatsapp") {
    window.open(
      "https://wa.me/?text=" + encodeURIComponent(combined),
      "_blank",
      "noopener"
    );
    return;
  }

  if (app === "telegram") {
    window.open(
      "https://t.me/share/url?url=" + encodeURIComponent(url) +
      "&text=" + encodeURIComponent(message),
      "_blank",
      "noopener"
    );
    return;
  }

  if (app === "facebook") {
    window.open(
      "https://www.facebook.com/sharer/sharer.php?u=" +
      encodeURIComponent(url),
      "_blank",
      "noopener"
    );
    return;
  }

  if (app === "viber") {
    await copyFutbolLink(false);
    window.location.href =
      "viber://forward?text=" + encodeURIComponent(combined);
    return;
  }

  if (app === "messenger") {
    await copyFutbolLink(false);

    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (mobile) {
      window.location.href =
        "fb-messenger://share/?link=" + encodeURIComponent(url);
    } else {
      window.open("https://www.messenger.com/", "_blank", "noopener");
      toast("Link kopeeritud — kleebi see Messengeri vestlusesse.");
    }
    return;
  }

  if (app === "instagram") {
    await copyFutbolLink(false);
    window.open("https://www.instagram.com/", "_blank", "noopener");
    toast("Link kopeeritud — kleebi see Instagrami sõnumisse.");
  }
}

async function savePrediction(matchId) {

  const homeInput =
    document.getElementById(
      "ph-" + matchId
    );

  const awayInput =
    document.getElementById(
      "pa-" + matchId
    );

  const home =
    Number(homeInput.value);

  const away =
    Number(awayInput.value);

  if (
    homeInput.value === "" ||
    awayInput.value === "" ||
    !Number.isInteger(home) ||
    !Number.isInteger(away) ||
    home < 0 ||
    away < 0 ||
    home > 30 ||
    away > 30
  ) {

    toast(
      "Sisesta korrektne skoor."
    );

    return;
  }

  const result =
    await sb
      .from("predictions")
      .upsert(
        {
          match_id: matchId,
          user_id: currentUser.id,
          home_score: home,
          away_score: away
        },
        {
          onConflict:
            "match_id,user_id"
        }
      );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    await loadAll();

    return;
  }

  toast(
    "Ennustus salvestatud."
  );

  await loadAll();
}

          'onclick="togglePanel(\'edit-' +
          match.id +
          '\')">' +
          "Muuda" +
        "</button>";
    }

    if (started) {

      html +=
        '<button ' +
          'class="btn btn-small" ' +
          'onclick="togglePanel(\'result-' +
          match.id +
          '\')">' +
          (
            finished
              ? "Muuda tulemust"
              : "Sisesta tulemus"
          ) +
        "</button>";
    }

    html +=
      '<button ' +
        'class="btn btn-danger btn-small" ' +
        'onclick="adminDeleteMatch(\'' +
        match.id +
        '\')">' +
        "Kustuta" +
      "</button>";

    html += "</div>";

    if (!started) {

      html +=
        '<div ' +
          'id="edit-' +
          match.id +
          '" ' +
          'class="admin-panel hidden">' +

          '<div class="form-grid">' +

            "<div>" +
              "<label>Kodumeeskond</label>" +
              '<input ' +
                'id="eh-' +
                match.id +
                '" ' +
                'class="input" ' +
                'value="' +
                esc(match.home_team) +
                '">' +
            "</div>" +

            "<div>" +
              "<label>Võõrsilmeeskond</label>" +
              '<input ' +
                'id="ea-' +
                match.id +
                '" ' +
                'class="input" ' +
                'value="' +
                esc(match.away_team) +
                '">' +
            "</div>" +

            '<div class="date-picker-row">' +
              "<div>" +
                "<label>Kuupäev (PP.KK.AAAA)</label>" +
                '<input ' +
                  'id="ekd-' +
                  match.id +
                  '" ' +
                  'class="input" ' +
                  'type="text" ' +
                  'inputmode="numeric" ' +
                  'maxlength="10" ' +
                  'autocomplete="off" ' +
                  'oninput="formatEuropeanDateInput(this)" ' +
                  'value="' +
                  formatDate(
                    match.kickoff_at
                  ) +
                  '">' +
              "</div>" +
              '<button ' +
                'type="button" ' +
                'class="calendar-trigger" ' +
                'aria-label="Vali kuupäev kalendrist" ' +
                'title="Vali kuupäev kalendrist" ' +
                'onclick="openDatePicker(\'ekc-' +
                match.id +
                '\', \'ekd-' +
                match.id +
                '\')">📅</button>' +
              '<input ' +
                'id="ekc-' +
                match.id +
                '" ' +
                'class="calendar-native" ' +
                'type="date" ' +
                'tabindex="-1" ' +
                'aria-hidden="true" ' +
                'onchange="syncDateFromPicker(\'ekc-' +
                match.id +
                '\', \'ekd-' +
                match.id +
                '\')">' +
            "</div>" +

            "<div>" +
              "<label>Kellaaeg (24 h)</label>" +
              '<input ' +
                'id="ekt-' +
                match.id +
                '" ' +
                'class="input" ' +
                'type="text" ' +
                'inputmode="numeric" ' +
                'maxlength="5" ' +
                'autocomplete="off" ' +
                'oninput="formatEuropeanTimeInput(this)" ' +
                'value="' +
                formatTime(
                  match.kickoff_at
                ) +
                '">' +
            "</div>" +

          "</div>" +

          '<button ' +
            'class="btn btn-block" ' +
            'onclick="adminUpdateMatch(\'' +
            match.id +
            '\')">' +
            "Salvesta muudatused" +
          "</button>" +

        "</div>";
    }

    if (started) {

      html +=
        '<div ' +
          'id="result-' +
          match.id +
          '" ' +
          'class="admin-panel hidden">' +

          '<div class="score-entry">' +

            '<div class="score-label-left">' +
              esc(match.home_team) +
            "</div>" +

            '<input ' +
              'id="rh-' +
              match.id +
              '" ' +
              'class="score-input" ' +
              'type="number" ' +
              'min="0" ' +
              'inputmode="numeric" ' +
              'value="' +
              (
                finished
                  ? match.home_score
                  : ""
              ) +
              '">' +

            '<div class="colon">:</div>' +

            '<input ' +
              'id="ra-' +
              match.id +
              '" ' +
              'class="score-input" ' +
              'type="number" ' +
              'min="0" ' +
              'inputmode="numeric" ' +
              'value="' +
              (
                finished
                  ? match.away_score
                  : ""
              ) +
              '">' +

            '<div class="score-label-right">' +
              esc(match.away_team) +
            "</div>" +

          "</div>" +

          '<label style="margin-top:14px">' +

            '<input ' +
              'id="extra-' +
              match.id +
              '" ' +
              'type="checkbox" ' +
              (
                match.went_to_extra_time
                  ? "checked"
                  : ""
              ) +
            "> " +

            "Tulemus sisaldab lisaaega" +

          "</label>" +

          '<div class="hint" style="text-align:left">' +
            "Penaltiseeria väravaid skoori ei lisata." +
          "</div>" +

          '<button ' +
            'class="btn btn-block" ' +
            'onclick="adminSetResult(\'' +
            match.id +
            '\')">' +
            "Salvesta tulemus" +
          "</button>" +

        "</div>";
    }

    html += "</div>";
  });

  area.innerHTML =
    html;
}

async function adminLogin() {

  const input =
    document.getElementById(
      "adminPinInput"
    );

  const errorBox =
    document.getElementById(
      "adminError"
    );

  const pin =
    input.value.trim();

  errorBox.textContent = "";

  if (!pin) {

    errorBox.textContent =
      "Sisesta PIN.";

    return;
  }

  const result =
    await sb.rpc(
      "admin_check_pin",
      {
        p_pin: pin
      }
    );

  if (result.error) {

    errorBox.textContent =
      friendlyError(
        result.error
      );

    return;
  }

  if (!result.data) {

    errorBox.textContent =
      "Vale PIN.";

    return;
  }

  adminPin =
    pin;

  adminVerified =
    true;

  renderAdmin();
}

function adminLogout() {

  adminPin = "";
  adminVerified = false;

  renderAdmin();
}

function togglePanel(id) {

  document
    .getElementById(id)
    .classList.toggle("hidden");
}

async function adminDeletePlayer(playerId) {

  if (playerId === currentUser.id) {
    toast("Enda kasutajat ei saa kustutada.");
    return;
  }

  const player = players.find(p => p.id === playerId);

  if (!player) {
    toast("Kasutajat ei leitud.");
    return;
  }

  const confirmed = window.confirm(
    "Kas kustutada kasutaja " + player.display_name +
    "? Kõik tema ennustused kustutatakse samuti."
  );

  if (!confirmed) {
    return;
  }

  const result = await sb.rpc(
    "admin_delete_player",
    {
      p_pin: adminPin,
      p_player_id: playerId
    }
  );

  if (result.error) {
    toast(friendlyError(result.error));
    return;
  }

  toast("Kasutaja " + player.display_name + " kustutatud.");
  await loadAll();
}

async function adminCreateMatch() {

  const home =
    document
      .getElementById("newHome")
      .value
      .trim();

  const away =
    document
      .getElementById("newAway")
      .value
      .trim();

  const dateValue =
    document
      .getElementById("newKickoffDate")
      .value;

  const timeValue =
    document
      .getElementById("newKickoffTime")
      .value;

  if (!home || !away || !dateValue || !timeValue) {

    toast(
      "Täida kõik mängu väljad."
    );

    return;
  }

  const kickoff =
    europeanKickoffToIso(dateValue, timeValue);

  if (!kickoff) {

    toast(
      "Sisesta kuupäev kujul PP.KK.AAAA ja kellaaeg 24 tunni kujul HH:MM."
    );

    return;
  }

  const result =
    await sb.rpc(
      "admin_create_match",
      {
        p_pin: adminPin,
        p_home_team: home,
        p_away_team: away,
        p_kickoff_at: kickoff
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng lisatud."
  );

  await loadAll();
}

async function adminUpdateMatch(matchId) {

  const home =
    document
      .getElementById(
        "eh-" + matchId
      )
      .value
      .trim();

  const away =
    document
      .getElementById(
        "ea-" + matchId
      )
      .value
      .trim();

  const dateValue =
    document
      .getElementById(
        "ekd-" + matchId
      )
      .value;

  const timeValue =
    document
      .getElementById(
        "ekt-" + matchId
      )
      .value;

  const kickoff =
    europeanKickoffToIso(dateValue, timeValue);

  if (!kickoff) {

    toast(
      "Sisesta kuupäev kujul PP.KK.AAAA ja kellaaeg 24 tunni kujul HH:MM."
    );

    return;
  }

  const result =
    await sb.rpc(
      "admin_update_match",
      {
        p_pin: adminPin,
        p_match_id: matchId,
        p_home_team: home,
        p_away_team: away,
        p_kickoff_at: kickoff
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng muudetud."
  );

  await loadAll();
}

async function adminSetResult(matchId) {

  const homeEl =
    document.getElementById(
      "rh-" + matchId
    );

  const awayEl =
    document.getElementById(
      "ra-" + matchId
    );

  if (
    homeEl.value === "" ||
    awayEl.value === ""
  ) {

    toast(
      "Sisesta lõpptulemus."
    );

    return;
  }

  const home =
    Number(homeEl.value);

  const away =
    Number(awayEl.value);

  if (
    !Number.isInteger(home) ||
    !Number.isInteger(away) ||
    home < 0 ||
    away < 0
  ) {

    toast(
      "Sisesta korrektne lõpptulemus."
    );

    return;
  }

  const extra =
    document
      .getElementById(
        "extra-" + matchId
      )
      .checked;

  const result =
    await sb.rpc(
      "admin_set_result",
      {
        p_pin: adminPin,
        p_match_id: matchId,
        p_home_score: home,
        p_away_score: away,
        p_went_to_extra_time: extra
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Tulemus salvestatud ja punktid arvutatud."
  );

  await loadAll();
}

async function adminDeleteMatch(matchId) {

  const match =
    matches.find(
      m => m.id === matchId
    );

  if (!match) {
    return;
  }

  const confirmed =
    window.confirm(
      "Kas kustutada mäng " +
      match.home_team +
      " – " +
      match.away_team +
      "? Selle mängu ennustused kustutatakse samuti."
    );

  if (!confirmed) {
    return;
  }

  const result =
    await sb.rpc(
      "admin_delete_match",
      {
        p_pin: adminPin,
        p_match_id: matchId
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng kustutatud."
  );

  await loadAll();
}

init();

setInterval(() => {

  if (
    currentUser &&
    currentPlayer
  ) {
    loadAll();
  }

}, 60000);

</script>
