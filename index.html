<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251b">

  <title>Futbol</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --dark: #10251b;
      --green: #176b43;
      --green2: #238653;
      --green-soft: #e8f4ed;
      --text: #172019;
      --muted: #68746c;
      --border: #dce5df;
      --danger: #a93232;
      --warning: #8b6516;
      --shadow: 0 5px 20px rgba(20, 40, 28, 0.07);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding-bottom: 85px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      background: var(--dark);
      color: white;
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        16px;
    }

    .topbar-inner {
      max-width: 720px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .player-label {
      color: #cddbd2;
      font-size: 11px;
      text-align: right;
    }

    #currentPlayer {
      text-align: right;
      font-weight: 800;
    }

    main {
      width: min(720px, 100%);
      margin: auto;
      padding: 16px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .welcome {
      max-width: 470px;
      margin: 48px auto 0;
      text-align: center;
    }

    .welcome-logo {
      font-size: 38px;
      font-weight: 950;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.5;
    }

    .input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #cbd6cf;
      border-radius: 12px;
      background: white;
      outline: none;
    }

    .input:focus,
    .score-input:focus {
      border-color: var(--green2);
      box-shadow: 0 0 0 3px rgba(35, 134, 83, 0.12);
    }

    .btn {
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-weight: 800;
    }

    .btn-block {
      width: 100%;
      margin-top: 10px;
    }

    .btn-small {
      min-height: 40px;
      padding: 0 12px;
      font-size: 14px;
    }

    .btn-secondary {
      background: #edf2ef;
      color: var(--text);
    }

    .btn-danger {
      background: #faeaea;
      color: var(--danger);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .match-title {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.25;
    }

    .match-date {
      margin-top: 5px;
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-open {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge-locked {
      background: #f8efd8;
      color: var(--warning);
    }

    .badge-finished {
      background: #e9eceb;
      color: #515b55;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin: 16px 0;
    }

    .team {
      font-weight: 850;
      line-height: 1.25;
    }

    .team:last-child {
      text-align: right;
    }

    .vs {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .score-entry {
      display: grid;
      grid-template-columns: 1fr 62px 18px 62px 1fr;
      align-items: center;
      gap: 6px;
    }

    .score-label-left,
    .score-label-right {
      font-size: 12px;
      font-weight: 700;
    }

    .score-label-left {
      text-align: right;
    }

    .score-label-right {
      text-align: left;
    }

    .score-input {
      width: 100%;
      height: 54px;
      border: 1px solid #cbd6cf;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      outline: none;
    }

    .colon {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
    }

    .hint {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .notice {
      padding: 12px;
      border-radius: 12px;
      background: #edf2ef;
      color: var(--muted);
      font-size: 14px;
    }

    .result {
      margin: 12px 0;
      padding: 10px;
      border-radius: 12px;
      background: #edf2ef;
      text-align: center;
      font-size: 22px;
      font-weight: 950;
    }

    .my-prediction {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--green-soft);
      font-size: 14px;
    }

    .prediction-list {
      margin-top: 13px;
      padding-top: 7px;
      border-top: 1px solid var(--border);
    }

    .prediction-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 9px 2px;
      border-bottom: 1px solid #edf1ee;
      font-size: 14px;
    }

    .prediction-score {
      font-weight: 900;
    }

    .points {
      min-width: 32px;
      text-align: right;
      color: var(--green);
      font-weight: 900;
    }

    .bottom-nav {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      padding-bottom: env(safe-area-inset-bottom);
      background: white;
      border-top: 1px solid var(--border);
    }

    .bottom-nav-inner {
      width: min(720px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .nav-btn {
      min-height: 64px;
      border: 0;
      background: white;
      color: var(--muted);
      font-weight: 800;
    }

    .nav-btn.active {
      color: var(--green);
      background: #f1f8f4;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 9px 6px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px 6px;
      border-bottom: 1px solid #edf1ee;
      font-size: 14px;
      white-space: nowrap;
    }

    .num {
      text-align: right;
    }

    .rank {
      font-size: 18px;
      font-weight: 950;
    }

    .leader {
      font-weight: 900;
    }

    .form-grid {
      display: grid;
      gap: 11px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .admin-panel {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .error {
      margin-top: 9px;
      color: var(--danger);
      font-size: 13px;
    }

    #toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      border-radius: 12px;
      background: #17241c;
      color: white;
      box-shadow: var(--shadow);
      font-size: 14px;
      text-align: center;
    }

    .loading {
      padding: 30px 10px;
      text-align: center;
      color: var(--muted);
    }

    @media (min-width: 600px) {
      main {
        padding-top: 24px;
      }

      .card {
        padding: 20px;
      }

      .score-entry {
        grid-template-columns: 1fr 72px 22px 72px 1fr;
      }
    }
  </style>
</head>

<body>

<div id="loadingScreen">
  <main>
    <div class="loading">Futbol käivitub...</div>
  </main>
</div>

<div id="nameGate" class="hidden">
  <main>
    <div class="card welcome">

      <div class="welcome-logo">FUTBOL</div>

      <p>
        Ennusta sõpradega jalgpallimängude tulemusi
        ja kogu punkte.
      </p>

      <input
        id="nameInput"
        class="input"
        maxlength="30"
        autocomplete="name"
        placeholder="Sinu nimi või hüüdnimi"
      >

      <button
        class="btn btn-block"
        onclick="savePlayerName()"
      >
        Sisene
      </button>

      <div id="nameError" class="error"></div>

    </div>
  </main>
</div>

<div id="app" class="hidden">

  <header class="topbar">
    <div class="topbar-inner">

      <div class="brand">
        FUTBOL
      </div>

      <div>
        <div class="player-label">Mängija</div>
        <div id="currentPlayer"></div>
      </div>

    </div>
  </header>

  <main>

    <section id="tab-games">
      <h2>Mängud</h2>
      <div id="games"></div>
    </section>

    <section id="tab-table" class="hidden">
      <h2>Üldtabel</h2>
      <div id="leaderboard"></div>
    </section>

    <section id="tab-admin" class="hidden">
      <h2>Admin</h2>
      <div id="adminArea"></div>
    </section>

  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">

      <button
        id="nav-games"
        class="nav-btn active"
        onclick="showTab('games')"
      >
        Mängud
      </button>

      <button
        id="nav-table"
        class="nav-btn"
        onclick="showTab('table')"
      >
        Tabel
      </button>

      <button
        id="nav-admin"
        class="nav-btn"
        onclick="showTab('admin')"
      >
        Admin
      </button>

    </div>
  </nav>

</div>

<div id="toast" class="hidden"></div>

<script>

const SUPABASE_URL = "const SUPABASE_URL =
  https://aanxpugvehwtcwwpefwx.supabase.co;
const SUPABASE_KEY = "sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

let currentUser = null;
let currentPlayer = null;

let matches = [];
let predictions = [];
let players = [];
let leaderboard = [];

let adminPin = "";
let adminVerified = false;

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function toast(message) {

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.classList.add("hidden");
  }, 2800);
}

function friendlyError(error) {

  const msg = String(error?.message || error || "");

  if (msg.includes("Ennustamine on lõppenud")) {
    return "Ennustamine on selleks mänguks lõppenud.";
  }

  if (msg.includes("Vale admin PIN")) {
    return "Vale administraatori PIN.";
  }

  if (msg.includes("duplicate key")) {
    return "See nimi on juba kasutusel.";
  }

  if (msg.includes("Alanud mängu ei saa muuta")) {
    return "Alanud mängu ei saa enam muuta.";
  }

  if (msg.includes("Uue mängu algusaeg peab olema tulevikus")) {
    return "Mängu algusaeg peab olema tulevikus.";
  }

  return msg || "Tekkis viga.";
}

function formatDate(timestamp) {

  return new Intl.DateTimeFormat(
    "et-EE",
    {
      timeZone: "Europe/Tallinn",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  ).format(new Date(timestamp));
}

function formatTime(timestamp) {

  return new Intl.DateTimeFormat(
    "et-EE",
    {
      timeZone: "Europe/Tallinn",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(new Date(timestamp));
}

function tallinnParts(timestamp) {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Europe/Tallinn",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }
    ).formatToParts(new Date(timestamp));

  const result = {};

  parts.forEach(part => {
    result[part.type] = part.value;
  });

  return result;
}

function isoToTallinnInput(timestamp) {

  const p = tallinnParts(timestamp);

  return (
    p.year + "-" +
    p.month + "-" +
    p.day + "T" +
    p.hour + ":" +
    p.minute
  );
}

function tallinnLocalToIso(value) {

  if (!value) {
    return null;
  }

  const parts = value.split("T");

  const date = parts[0].split("-").map(Number);
  const time = parts[1].split(":").map(Number);

  const target = Date.UTC(
    date[0],
    date[1] - 1,
    date[2],
    time[0],
    time[1],
    0
  );

  let guess = target;

  for (let i = 0; i < 4; i++) {

    const p =
      tallinnParts(
        new Date(guess).toISOString()
      );

    const rendered = Date.UTC(
      Number(p.year),
      Number(p.month) - 1,
      Number(p.day),
      Number(p.hour),
      Number(p.minute),
      0
    );

    guess += target - rendered;
  }

  return new Date(guess).toISOString();
}

function isStarted(match) {

  return (
    Date.now() >=
    new Date(match.kickoff_at).getTime()
  );
}

function isFinished(match) {

  return (
    match.home_score !== null &&
    match.home_score !== undefined &&
    match.away_score !== null &&
    match.away_score !== undefined
  );
}

function playerName(id) {

  const player =
    players.find(p => p.id === id);

  return player
    ? player.display_name
    : "Mängija";
}

function calculatePoints(prediction, match) {

  if (!isFinished(match)) {
    return null;
  }

  const ph = Number(prediction.home_score);
  const pa = Number(prediction.away_score);

  const ah = Number(match.home_score);
  const aa = Number(match.away_score);

  if (ph === ah && pa === aa) {
    return 3;
  }

  if (ph > pa && ah > aa) {
    return 1;
  }

  if (ph < pa && ah < aa) {
    return 1;
  }

  if (ph === pa && ah === aa) {
    return 1;
  }

  return 0;
}

async function init() {

  try {

    if (
      SUPABASE_URL.includes("SINU_") ||
      SUPABASE_KEY.includes("SINU_")
    ) {
      throw new Error(
        "Supabase URL või Publishable key on index.html failis veel sisestamata."
      );
    }

    const sessionResult =
      await sb.auth.getSession();

    if (sessionResult.error) {
      throw sessionResult.error;
    }

    let session =
      sessionResult.data.session;

    if (!session) {

      const signIn =
        await sb.auth.signInAnonymously();

      if (signIn.error) {
        throw signIn.error;
      }

      session =
        signIn.data.session;
    }

    currentUser =
      session.user;

    const playerResult =
      await sb
        .from("players")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (playerResult.error) {
      throw playerResult.error;
    }

    currentPlayer =
      playerResult.data;

    document
      .getElementById("loadingScreen")
      .classList.add("hidden");

    if (!currentPlayer) {

      document
        .getElementById("nameGate")
        .classList.remove("hidden");

      return;
    }

    await enterApp();

  } catch (error) {

    document
      .getElementById("loadingScreen")
      .innerHTML =
      '<main><div class="card">' +
      "<h2>Futboli käivitamine ebaõnnestus</h2>" +
      '<div class="error">' +
      esc(friendlyError(error)) +
      "</div></div></main>";
  }
}

async function savePlayerName() {

  const input =
    document.getElementById("nameInput");

  const errorBox =
    document.getElementById("nameError");

  const name =
    input.value.trim();

  errorBox.textContent = "";

  if (!name) {

    errorBox.textContent =
      "Sisesta oma nimi või hüüdnimi.";

    return;
  }

  const result =
    await sb
      .from("players")
      .insert({
        id: currentUser.id,
        display_name: name
      })
      .select()
      .single();

  if (result.error) {

    if (result.error.code === "23505") {

      errorBox.textContent =
        "See nimi on juba kasutusel. Kasuta teist nime või hüüdnime.";

    } else {

      errorBox.textContent =
        friendlyError(result.error);
    }

    return;
  }

  currentPlayer =
    result.data;

  document
    .getElementById("nameGate")
    .classList.add("hidden");

  await enterApp();
}

async function enterApp() {

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("currentPlayer")
    .textContent =
    currentPlayer.display_name;

  await loadAll();
}

async function loadAll() {

  const matchResult =
    await sb
      .from("matches")
      .select("*");

  if (matchResult.error) {

    toast(
      friendlyError(matchResult.error)
    );

    return;
  }

  matches =
    matchResult.data || [];

  matches.sort((a, b) => {

    const aStarted = isStarted(a);
    const bStarted = isStarted(b);

    if (aStarted !== bStarted) {
      return aStarted ? 1 : -1;
    }

    if (!aStarted) {
      return (
        new Date(a.kickoff_at) -
        new Date(b.kickoff_at)
      );
    }

    return (
      new Date(b.kickoff_at) -
      new Date(a.kickoff_at)
    );
  });

  const playerResult =
    await sb
      .from("players")
      .select("id,display_name");

  if (!playerResult.error) {
    players = playerResult.data || [];
  }

  const predictionResult =
    await sb
      .from("predictions")
      .select("*");

  if (!predictionResult.error) {
    predictions =
      predictionResult.data || [];
  }

  const boardResult =
    await sb.rpc(
      "get_leaderboard"
    );

  if (!boardResult.error) {

    leaderboard =
      boardResult.data || [];
  }

  renderGames();
  renderLeaderboard();

  if (adminVerified) {
    renderAdmin();
  }
}

function renderGames() {

  const container =
    document.getElementById("games");

  if (!matches.length) {

    container.innerHTML =
      '<div class="card">' +
      '<div class="notice">' +
      "Ühtegi mängu pole veel lisatud." +
      "</div></div>";

    return;
  }

  let html = "";

  matches.forEach(match => {

    const started =
      isStarted(match);

    const finished =
      isFinished(match);

    let badgeClass =
      "badge-open";

    let badgeText =
      "Avatud";

    if (started) {

      badgeClass =
        "badge-locked";

      badgeText =
        "Lukus";
    }

    if (finished) {

      badgeClass =
        "badge-finished";

      badgeText =
        "Lõppenud";
    }

    const own =
      predictions.find(
        p =>
          p.match_id === match.id &&
          p.user_id === currentUser.id
      );

    const visiblePredictions =
      predictions
        .filter(
          p => p.match_id === match.id
        )
        .sort(
          (a, b) =>
            playerName(a.user_id)
              .localeCompare(
                playerName(b.user_id),
                "et"
              )
        );

    html += '<article class="card">';

    html +=
      '<div class="match-header">' +
        "<div>" +
          '<div class="match-title">' +
            esc(match.home_team) +
            " – " +
            esc(match.away_team) +
          "</div>" +
          '<div class="match-date">' +
            formatDate(match.kickoff_at) +
            " · " +
            formatTime(match.kickoff_at) +
          "</div>" +
        "</div>" +
        '<span class="badge ' +
          badgeClass +
        '">' +
          badgeText +
        "</span>" +
      "</div>";

    html +=
      '<div class="teams">' +
        '<div class="team">' +
          esc(match.home_team) +
        "</div>" +
        '<div class="vs">VS</div>' +
        '<div class="team">' +
          esc(match.away_team) +
        "</div>" +
      "</div>";

    if (finished) {

      html +=
        '<div class="result">' +
          match.home_score +
          " : " +
          match.away_score +
        "</div>";

      if (match.went_to_extra_time) {

        html +=
          '<div class="hint">' +
          "Tulemus sisaldab lisaaega. Penaltiseeria ei lähe skoori." +
          "</div>";
      }
    }

    if (!started) {

      html +=
        '<div class="score-entry">' +

          '<div class="score-label-left">' +
            esc(match.home_team) +
          "</div>" +

          '<input ' +
            'id="ph-' + match.id + '" ' +
            'class="score-input" ' +
            'type="number" ' +
            'min="0" max="30" ' +
            'inputmode="numeric" ' +
            'value="' +
              (own ? own.home_score : "") +
            '">' +

          '<div class="colon">:</div>' +

          '<input ' +
            'id="pa-' + match.id + '" ' +
            'class="score-input" ' +
            'type="number" ' +
            'min="0" max="30" ' +
            'inputmode="numeric" ' +
            'value="' +
              (own ? own.away_score : "") +
            '">' +

          '<div class="score-label-right">' +
            esc(match.away_team) +
          "</div>" +

        "</div>";

      html +=
        '<button class="btn btn-block" ' +
          'onclick="savePrediction(\'' +
          match.id +
          '\')">' +
          (
            own
              ? "Muuda ennustust"
              : "Salvesta ennustus"
          ) +
        "</button>";

      html +=
        '<div class="hint">' +
          "Ennustamine lõpeb mängu alguses. " +
          "Teiste ennustused on seni peidetud." +
        "</div>";

    } else {

      html +=
        '<div class="notice">' +
          "Ennustamine on lõppenud." +
        "</div>";

      if (own) {

        html +=
          '<div class="my-prediction">' +
            "Sinu ennustus: <strong>" +
            own.home_score +
            " : " +
            own.away_score +
            "</strong>";

        if (finished) {

          html +=
            " · <strong>" +
            calculatePoints(
              own,
              match
            ) +
            " p</strong>";
        }

        html += "</div>";
      }

      html +=
        '<div class="prediction-list">';

      if (!visiblePredictions.length) {

        html +=
          '<div class="hint">' +
            "Sellele mängule ennustusi ei tehtud." +
          "</div>";

      } else {

        visiblePredictions
          .forEach(pred => {

            html +=
              '<div class="prediction-row">' +

                "<div>" +
                  esc(
                    playerName(
                      pred.user_id
                    )
                  ) +
                "</div>" +

                '<div class="prediction-score">' +
                  pred.home_score +
                  " : " +
                  pred.away_score +
                "</div>" +

                '<div class="points">';

            if (finished) {

              html +=
                calculatePoints(
                  pred,
                  match
                ) +
                " p";
            }

            html +=
                "</div>" +
              "</div>";
          });
      }

      html += "</div>";
    }

    html += "</article>";
  });

  container.innerHTML =
    html;
}

async function savePrediction(matchId) {

  const homeInput =
    document.getElementById(
      "ph-" + matchId
    );

  const awayInput =
    document.getElementById(
      "pa-" + matchId
    );

  const home =
    Number(homeInput.value);

  const away =
    Number(awayInput.value);

  if (
    homeInput.value === "" ||
    awayInput.value === "" ||
    !Number.isInteger(home) ||
    !Number.isInteger(away) ||
    home < 0 ||
    away < 0 ||
    home > 30 ||
    away > 30
  ) {

    toast(
      "Sisesta korrektne skoor."
    );

    return;
  }

  const result =
    await sb
      .from("predictions")
      .upsert(
        {
          match_id: matchId,
          user_id: currentUser.id,
          home_score: home,
          away_score: away
        },
        {
          onConflict:
            "match_id,user_id"
        }
      );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    await loadAll();

    return;
  }

  toast(
    "Ennustus salvestatud."
  );

  await loadAll();
}

      "leaderboard"
    );

    container.innerHTML =

        '<div class="notice">' +
          "Tabel on veel tühi." +

      "</div>";

    return;
  }

  let html =
    '<div class="card table-wrap">' +
    "<table>" +
    "<thead>" +
    "<tr>" +

    "<th>Mängija</th>" +
    '<th class="num">Punktid</th>' +
    '<th class="num">Täpsed</th>' +
    '<th class="num">Enn.</th>' +
    "</tr>" +
    "</thead>" +
    "<tbody>";

function showTab(name) {

  [
    "games",
    "table",
    "admin"
  ].forEach(tab => {

    document
      .getElementById(
        "tab-" + tab
      )
      .classList.toggle(
        "hidden",
        tab !== name
      );

    document
      .getElementById(
        "nav-" + tab
      )
      .classList.toggle(
        "active",
        tab === name
      );
  });

  if (name === "admin") {
    renderAdmin();
  }

  if (name === "table") {
    loadAll();
  }
}

async function adminLogin() {

  const input =
    document.getElementById(
      "adminPinInput"
    );

  const errorBox =
    document.getElementById(
      "adminError"
    );

  const pin =
    input.value.trim();

  errorBox.textContent = "";

  if (!pin) {

    errorBox.textContent =
      "Sisesta PIN.";

    return;
  }

  const result =
    await sb.rpc(
      "admin_check_pin",
      {
        p_pin: pin
      }
    );

  if (result.error) {

    errorBox.textContent =
      friendlyError(
        result.error
      );

    return;
  }

  if (!result.data) {

    errorBox.textContent =
      "Vale PIN.";

    return;
  }

  adminPin =
    pin;

  adminVerified =
    true;

  renderAdmin();
}

function adminLogout() {

  adminPin = "";
  adminVerified = false;

  renderAdmin();
}

function togglePanel(id) {

  document
    .getElementById(id)
    .classList.toggle("hidden");
}

async function adminCreateMatch() {

  const home =
    document
      .getElementById("newHome")
      .value
      .trim();

  const away =
    document
      .getElementById("newAway")
      .value
      .trim();

  const local =
    document
      .getElementById("newKickoff")
      .value;

  if (!home || !away || !local) {

    toast(
      "Täida kõik mängu väljad."
    );

    return;
  }

  const kickoff =
    tallinnLocalToIso(local);

  const result =
    await sb.rpc(
      "admin_create_match",
      {
        p_pin: adminPin,
        p_home_team: home,
        p_away_team: away,
        p_kickoff_at: kickoff
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng lisatud."
  );

  await loadAll();
}

async function adminUpdateMatch(matchId) {

  const home =
    document
      .getElementById(
        "eh-" + matchId
      )
      .value
      .trim();

  const away =
    document
      .getElementById(
        "ea-" + matchId
      )
      .value
      .trim();

  const local =
    document
      .getElementById(
        "ek-" + matchId
      )
      .value;

  const kickoff =
    tallinnLocalToIso(local);

  const result =
    await sb.rpc(
      "admin_update_match",
      {
        p_pin: adminPin,
        p_match_id: matchId,
        p_home_team: home,
        p_away_team: away,
        p_kickoff_at: kickoff
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng muudetud."
  );

  await loadAll();
}

async function adminSetResult(matchId) {

  const homeEl =
    document.getElementById(
      "rh-" + matchId
    );

  const awayEl =
    document.getElementById(
      "ra-" + matchId
    );

  if (
    homeEl.value === "" ||
    awayEl.value === ""
  ) {

    toast(
      "Sisesta lõpptulemus."
    );

    return;
  }

  const home =
    Number(homeEl.value);

  const away =
    Number(awayEl.value);

  if (
    !Number.isInteger(home) ||
    !Number.isInteger(away) ||
    home < 0 ||
    away < 0
  ) {

    toast(
      "Sisesta korrektne lõpptulemus."
    );

    return;
  }

  const extra =
    document
      .getElementById(
        "extra-" + matchId
      )
      .checked;

  const result =
    await sb.rpc(
      "admin_set_result",
      {
        p_pin: adminPin,
        p_match_id: matchId,
        p_home_score: home,
        p_away_score: away,
        p_went_to_extra_time: extra
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Tulemus salvestatud ja punktid arvutatud."
  );

  await loadAll();
}

async function adminDeleteMatch(matchId) {

  const match =
    matches.find(
      m => m.id === matchId
    );

  if (!match) {
    return;
  }

  const confirmed =
    window.confirm(
      "Kas kustutada mäng " +
      match.home_team +
      " – " +
      match.away_team +
      "? Selle mängu ennustused kustutatakse samuti."
    );

  if (!confirmed) {
    return;
  }

  const result =
    await sb.rpc(
      "admin_delete_match",
      {
        p_pin: adminPin,
        p_match_id: matchId
      }
    );

  if (result.error) {

    toast(
      friendlyError(
        result.error
      )
    );

    return;
  }

  toast(
    "Mäng kustutatud."
  );

  await loadAll();
}

init();

setInterval(() => {

  if (
    currentUser &&
    currentPlayer
  ) {
    loadAll();
  }

}, 60000);

</script>
