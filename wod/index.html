<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101612">
<title>WOD</title>
<style>
:root{--g:#119447;--g2:#0b7136;--bg:#f2f5f3;--card:#fff;--text:#152019;--muted:#6d7771;--line:#dce4df;--dark:#101612;--red:#b93b41}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,textarea{font:inherit}.app{max-width:520px;min-height:100svh;margin:auto;background:var(--bg)}.auth{min-height:100svh;background:linear-gradient(150deg,#0f1511,#1f2c24);padding:24px;display:flex;align-items:center}.authbox{width:100%;max-width:420px;margin:auto}.logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#24bd65,#087233);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:950}.auth h1{color:#fff;font-size:35px;margin:18px 0 4px}.auth p{color:#c6cfca;margin:0 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px}.tabs{display:flex;background:#edf1ef;border-radius:13px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px 2px}.field input,.field textarea{width:100%;border:1px solid #d4ded8;background:#fbfcfb;border-radius:13px;padding:12px;outline:none}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850}.primary{background:linear-gradient(#16a550,#0d873f);color:#fff}.secondary{background:#e9efeb;color:#26312b}.danger{background:#fdebed;color:var(--red)}.block{width:100%}.notice{padding:11px;border-radius:12px;background:#edf6ef;color:#31543d;font-size:12px;margin-bottom:10px}.notice.bad{background:#fff0f1;color:#81383c}.top{background:#101612;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:21px}.content{padding:16px 16px 36px}.hero{background:linear-gradient(135deg,#111914,#1b2d21);color:#fff;border-radius:24px;padding:21px;margin-bottom:16px}.hero h1{margin:4px 0 8px;font-size:26px}.hero p{margin:0;color:#c6d0ca;font-size:14px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:18px;margin:0}.stack{display:grid;gap:10px}.training{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.training h3{margin:0 0 5px}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.people{font-size:12px;color:#415047;margin-top:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.empty{text-align:center;color:var(--muted);padding:30px 18px;background:#fff;border:1px solid var(--line);border-radius:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="root" class="app">
  <div class="auth" id="authScreen">
    <div class="authbox">
      <div class="logo">W</div>
      <h1>WOD</h1>
      <p>CrossFit treeningutele registreerimine.</p>
      <div class="card">
        <div class="tabs"><button id="tabLogin" class="on">Logi sisse</button><button id="tabSignup">Loo konto</button></div>
        <div id="message"></div>
        <div id="nameField" class="field hidden"><label>Ees- ja perekonnanimi</label><input id="name" autocomplete="name"></div>
        <div class="field"><label>E-post</label><input id="email" type="email" autocomplete="email"></div>
        <div class="field"><label>Parool</label><input id="password" type="password" autocomplete="current-password"></div>
        <button id="authButton" class="btn primary block">Logi sisse</button>
      </div>
    </div>
  </div>
  <div id="mainScreen" class="hidden"></div>
</div>
<script>
'use strict';
const BASE='https://aanxpugvehwtcwwpefwx.supabase.co';
const KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const SIGNUP_REDIRECT='https://karlkirch.github.io/Futbol/wod/';
let mode='login';
let session=null;
let profile=null;
let trainings=[];
let registrations=[];
let profiles=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>(Number(c||0)/100).toFixed(2).replace('.',',')+' €';
function headers(token){const h={'apikey':KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}
async function request(url,opt={}){const r=await fetch(url,opt);const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok){const msg=(data&&typeof data==='object'&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+r.status);throw new Error(msg)}return data}
function showMessage(text,bad=false){$('message').innerHTML=text?`<div class="notice${bad?' bad':''}">${esc(text)}</div>`:''}
function setMode(next){mode=next;$('tabLogin').classList.toggle('on',mode==='login');$('tabSignup').classList.toggle('on',mode==='signup');$('nameField').classList.toggle('hidden',mode!=='signup');$('authButton').textContent=mode==='login'?'Logi sisse':'Loo konto';$('password').autocomplete=mode==='login'?'current-password':'new-password';showMessage('')}
$('tabLogin').onclick=()=>setMode('login');$('tabSignup').onclick=()=>setMode('signup');
async function authSubmit(){const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||!password||(mode==='signup'&&!name)){showMessage('Täida kõik väljad.',true);return}showMessage('Palun oota…');try{let data;if(mode==='signup'){data=await request(BASE+'/auth/v1/signup?redirect_to='+encodeURIComponent(SIGNUP_REDIRECT),{method:'POST',headers:headers(),body:JSON.stringify({email,password,data:{display_name:name}})});if(!data.access_token){showMessage('Konto loodud. Kinnita e-postis saadetud link ja logi seejärel sisse.');return}}else{data=await request(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify({email,password})})}session=data;localStorage.setItem('wod_session',JSON.stringify(data));await loadApp()}catch(e){showMessage(e.message||'Sisselogimine ebaõnnestus.',true)}}
$('authButton').onclick=authSubmit;
async function api(path,opt={}){if(!session?.access_token)throw new Error('Sessioon puudub');return request(BASE+'/rest/v1/'+path,{...opt,headers:{...headers(session.access_token),...(opt.headers||{})}})}
async function rpc(name,body){return api('rpc/'+name,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)})}
async function ensureProfile(){let rows=await api('wod_profiles?select=user_id,display_name,role&user_id=eq.'+session.user.id);if(!rows.length){const n=(session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'Kasutaja').trim();await rpc('wod_ensure_profile',{new_display_name:n});rows=await api('wod_profiles?select=user_id,display_name,role&user_id=eq.'+session.user.id)}profile=rows[0]}
async function loadData(){const now=new Date(Date.now()-86400000).toISOString();[trainings,registrations,profiles]=await Promise.all([api('wod_trainings?select=*&starts_at=gte.'+encodeURIComponent(now)+'&order=starts_at.asc'),api('wod_registrations?select=*&status=neq.cancelled&order=created_at.asc'),api('wod_profiles?select=user_id,display_name,role&order=display_name.asc')])}
function pname(id){return profiles.find(p=>p.user_id===id)?.display_name||'Kasutaja'}
function mine(t){return registrations.find(r=>r.training_id===t.id&&r.user_id===session.user.id&&r.status!=='cancelled')}
function confirmed(t){return registrations.filter(r=>r.training_id===t.id&&r.status==='confirmed')}
function dateText(iso){return new Intl.DateTimeFormat('et-EE',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
async function register(id){try{await rpc('wod_register',{p_training_id:id,p_use_credit:false});await loadData();renderMain()}catch(e){alert(e.message)}}
async function cancelReg(id){try{await rpc('wod_cancel_registration',{p_training_id:id});await loadData();renderMain()}catch(e){alert(e.message)}}
async function createTraining(){const date=$('tdate').value,time=$('ttime').value,title=$('ttitle').value.trim()||'CrossFit',cap=Number($('tcap').value||12),price=Math.round(Number($('tprice').value||0)*100),note=$('tnote').value.trim();if(!date||!time){alert('Sisesta kuupäev ja kellaaeg.');return}const starts=new Date(date+'T'+time+':00+03:00').toISOString();const close=new Date(new Date(starts).getTime()-2*3600000).toISOString();try{await api('wod_trainings',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({created_by:session.user.id,title,starts_at:starts,duration_minutes:60,capacity:cap,price_cents:price,registration_closes_at:close,cancellation_hours:4,note:note||null,status:'published'})});await loadData();renderMain()}catch(e){alert(e.message)}}
function trainingHtml(t){const c=confirmed(t),m=mine(t),names=c.map(r=>esc(pname(r.user_id))).join(', ')||'Keegi pole veel registreerunud';return `<div class="training"><h3>${esc(t.title)}</h3><div class="meta"><span>${esc(dateText(t.starts_at))}</span><span>${c.length}/${t.capacity} kohta</span><span>${money(t.price_cents)}</span></div><div class="people"><b>Registreerunud:</b> ${names}</div><div class="actions">${m?`<button class="btn danger" onclick="cancelReg(${t.id})">Tühista</button>`:`<button class="btn primary" onclick="register(${t.id})">Registreeru</button>`}</div></div>`}
function renderMain(){const trainer=profile?.role==='trainer';$('authScreen').classList.add('hidden');const el=$('mainScreen');el.classList.remove('hidden');const upcoming=trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());el.innerHTML=`<div class="top"><div><b>WOD</b><div style="font-size:11px;color:#aeb8b2">${trainer?'Treener':'Treeningud'}</div></div><button class="btn secondary" onclick="logout()">Logi välja</button></div><div class="content"><div class="hero"><h1>${trainer?'Treeneri ülevaade':'Tulevased treeningud'}</h1><p>${trainer?'Lisa treeningud ja jälgi osalejate arvu.':'Vali sobiv treening ja registreeru.'}</p></div>${trainer?`<div class="section"><h2>Lisa treening</h2></div><div class="card"><div class="formgrid"><div class="field"><label>Kuupäev</label><input id="tdate" type="date"></div><div class="field"><label>Kellaaeg</label><input id="ttime" type="time" value="18:30"></div></div><div class="field"><label>Nimetus</label><input id="ttitle" value="CrossFit"></div><div class="formgrid"><div class="field"><label>Kohti</label><input id="tcap" type="number" value="12"></div><div class="field"><label>Hind (€)</label><input id="tprice" type="number" step="0.01" value="8"></div></div><div class="field"><label>Märkus</label><textarea id="tnote"></textarea></div><button class="btn primary block" onclick="createTraining()">Avalda treening</button></div>`:''}<div class="section"><h2>Tulevased treeningud</h2></div><div class="stack">${upcoming.length?upcoming.map(trainingHtml).join(''):'<div class="empty">Treeninguid pole veel lisatud.</div>'}</div></div>`}
async function loadApp(){try{await ensureProfile();await loadData();renderMain()}catch(e){showMessage(e.message||'Andmete laadimine ebaõnnestus.',true);$('authScreen').classList.remove('hidden');$('mainScreen').classList.add('hidden')}}
function logout(){localStorage.removeItem('wod_session');session=null;profile=null;trainings=[];registrations=[];profiles=[];$('mainScreen').classList.add('hidden');$('authScreen').classList.remove('hidden');showMessage('')}
window.register=register;window.cancelReg=cancelReg;window.createTraining=createTraining;window.logout=logout;
(async function boot(){try{const raw=localStorage.getItem('wod_session');if(raw){session=JSON.parse(raw);if(session?.access_token){await loadApp();return}}}catch(_){localStorage.removeItem('wod_session')}setMode('login')})();
</script>
</body></html>
