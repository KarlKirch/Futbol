    .profile-card{padding:18px}.profile-top{display:flex;align-items:center;gap:13px}.bigavatar{width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,#dceee3,#9bc7ab);display:grid;place-items:center;font-size:19px;font-weight:900}.profile-top h2{margin:0 0 2px;font-size:19px}.profile-top p{margin:0;color:var(--muted);font-size:13px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metric{background:#f3f6f4;border-radius:16px;padding:13px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:3px;font-size:22px}.settings{margin-top:12px;overflow:hidden}.setting{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px}.setting:last-child{border-bottom:0}

    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statbox{padding:15px}.statbox span{display:block;color:var(--muted);font-size:11px}.statbox b{font-size:24px}.barlist{padding:16px}.barrow{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.bar{height:9px;background:#e7ece9;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#24a95b;border-radius:999px}.empty{text-align:center;padding:38px 18px;color:var(--muted)}.empty b{display:block;color:#26332c;margin-bottom:5px}.loader{padding:50px 20px;text-align:center;color:var(--muted)}

    .auth-shell{min-height:100svh;background:linear-gradient(155deg,#0f1412,#1d2a23 58%,#12361f);color:white;padding:28px 18px 40px;display:flex;align-items:center}.authbox{width:100%;max-width:420px;margin:auto}.auth-logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#25ba64,#0a7434);display:grid;place-items:center;font-size:27px;font-weight:950;margin-bottom:22px}.authbox h1{font-size:34px;line-height:1.02;margin:0 0 8px}.authbox>p{color:#c7d0cb;margin:0 0 22px}.authcard{background:white;color:var(--text);border-radius:26px;padding:18px}.auth-tabs{display:flex;background:#edf1ef;border-radius:14px;padding:4px;margin-bottom:16px}.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;color:#66716b}.auth-tabs button.active{background:white;color:#1d2923;box-shadow:0 2px 8px #0001}.authmsg{font-size:12px;border-radius:12px;padding:10px 12px;margin-bottom:12px;background:#eef6f0;color:#32523c}.authmsg.bad{background:#fff0f1;color:#8b3438}.tiny{font-size:11px;color:var(--muted);line-height:1.45}.toast{position:fixed;z-index:90;left:50%;bottom:92px;transform:translateX(-50%);width:min(450px,calc(100% - 32px));padding:13px 15px;border-radius:14px;color:white;background:#18231d;box-shadow:0 10px 30px #0003;font-size:13px}.toast.bad{background:#8e3035}.toast.good{background:#0d7e3a}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://aanxpugvehwtcwwpefwx.supabase.co';
const SUPABASE_KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const TZ='Europe/Tallinn';
const state={session:null,profile:null,wallet:{credits:0},trainings:[],registrations:[],profiles:[],view:'trainings',selected:null,authMode:'login',loading:true};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const euro=c=>(Number(c||0)/100).toFixed(2).replace('.',',')+' €';
const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const fmtDate=iso=>{const d=new Date(iso);return {day:new Intl.DateTimeFormat('et-EE',{day:'2-digit',timeZone:TZ}).format(d),mon:new Intl.DateTimeFormat('et-EE',{month:'short',timeZone:TZ}).format(d).replace('.',''),full:new Intl.DateTimeFormat('et-EE',{weekday:'long',day:'numeric',month:'long',timeZone:TZ}).format(d)};};
const fmtTime=iso=>new Intl.DateTimeFormat('et-EE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}).format(new Date(iso));
const endTime=t=>{const d=new Date(t.starts_at);d.setMinutes(d.getMinutes()+t.duration_minutes);return new Intl.DateTimeFormat('et-EE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}).format(d)};
const isTrainer=()=>state.profile?.role==='trainer';
const mine=t=>state.registrations.find(r=>r.training_id===t.id&&r.user_id===state.session?.user?.id&&r.status!=='cancelled');
const regsFor=t=>state.registrations.filter(r=>r.training_id===t.id&&r.status!=='cancelled');
const confirmedFor=t=>regsFor(t).filter(r=>r.status==='confirmed');
const waitFor=t=>regsFor(t).filter(r=>r.status==='waitlist');
const profileName=id=>state.profiles.find(p=>p.user_id===id)?.display_name||'Kasutaja';
function toast(msg,type='good'){const x=document.createElement('div');x.className='toast '+type;x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function errText(e){return e?.message||'Tekkis viga.'}
async function boot(){state.loading=true;render();const {data:{session}}=await sb.auth.getSession();state.session=session;if(session){await ensureProfile();await loadData();}state.loading=false;render();}
async function ensureProfile(){if(!state.session)return;let {data,error}=await sb.from('wod_profiles').select('user_id,display_name,role,created_at,updated_at').eq('user_id',state.session.user.id).maybeSingle();if(error)throw error;if(!data){const name=(state.session.user.user_metadata?.display_name||state.session.user.email?.split('@')[0]||'Kasutaja').trim();const res=await sb.rpc('wod_ensure_profile',{new_display_name:name});if(res.error)throw res.error;data=res.data;}state.profile=data;}
async function loadData(){if(!state.session)return;const now=new Date(Date.now()-24*3600*1000).toISOString();const [tr,rg,pf,wa]=await Promise.all([
  sb.from('wod_trainings').select('*').gte('starts_at',now).order('starts_at'),
  sb.from('wod_registrations').select('*').neq('status','cancelled').order('created_at'),
  sb.from('wod_profiles').select('user_id,display_name,role,created_at,updated_at').order('display_name'),
  sb.from('wod_wallets').select('credits').eq('user_id',state.session.user.id).maybeSingle()
]);
for(const r of [tr,rg,pf,wa])if(r.error)throw r.error;state.trainings=tr.data||[];state.registrations=rg.data||[];state.profiles=pf.data||[];state.wallet=wa.data||{credits:0};state.profile=state.profiles.find(p=>p.user_id===state.session.user.id)||state.profile;}
async function refresh(){try{await loadData();render()}catch(e){toast(errText(e),'bad')}}
function authView(){return `<div class="auth-shell"><div class="authbox"><div class="auth-logo">W</div><h1>WOD</h1><p>CrossFit treeningutele registreerimine.</p><div class="authcard"><div class="auth-tabs"><button class="${state.authMode==='login'?'active':''}" onclick="setAuthMode('login')">Logi sisse</button><button class="${state.authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">Loo konto</button></div><div id="authmsg"></div>${state.authMode==='signup'?`<div class="field"><label>Ees- ja perekonnanimi</label><input id="aname" autocomplete="name" placeholder="Karl Kirch"></div>`:''}<div class="field"><label>E-post</label><input id="aemail" type="email" autocomplete="email" placeholder="nimi@email.ee"></div><div class="field"><label>Parool</label><input id="apass" type="password" autocomplete="${state.authMode==='login'?'current-password':'new-password'}" placeholder="Vähemalt 6 märki"></div><button class="btn primary block" onclick="authSubmit()">${state.authMode==='login'?'Logi sisse':'Loo konto'}</button><p class="tiny" style="margin:12px 2px 0">Konto on vajalik, et sinu registreeringud töötaksid kõigis seadmetes. Grupiliikmed näevad treeningule registreerunud inimeste nimesid.</p></div></div></div>`}
function setAuthMode(m){state.authMode=m;render()}
async function authSubmit(){const email=document.getElementById('aemail')?.value.trim();const password=document.getElementById('apass')?.value;const name=document.getElementById('aname')?.value.trim();const box=document.getElementById('authmsg');if(!email||!password||(state.authMode==='signup'&&!name)){box.innerHTML='<div class="authmsg bad">Täida kõik väljad.</div>';return}box.innerHTML='<div class="authmsg">Palun oota…</div>';try{if(state.authMode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;if(!data.session){box.innerHTML='<div class="authmsg">Konto loodud. Kinnita e-postis saadetud link ja logi seejärel siin sisse.</div>';return}state.session=data.session;await ensureProfile();await loadData();state.loading=false;render();}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;state.session=data.session;await ensureProfile();await loadData();render();}}catch(e){box.innerHTML='<div class="authmsg bad">'+esc(errText(e))+'</div>'}}
async function signOut(){await sb.auth.signOut();state.session=null;state.profile=null;state.trainings=[];state.registrations=[];state.profiles=[];state.view='trainings';render()}
function top(){return `<div class="topbar"><div class="brandrow"><div class="brand"><div class="brandmark">W</div><div><strong>WOD</strong><small>${isTrainer()?'Treener':'Treeningud'}</small></div></div><div class="top-actions"><span class="chip">${esc(state.profile?.display_name||'')}</span><button class="iconbtn" onclick="refresh()" title="Värskenda">↻</button></div></div></div>`}
function nav(){if(isTrainer())return `<div class="nav"><button class="${state.view==='overview'?'active':''}" onclick="go('overview')"><span class="ico">▦</span>Ülevaade</button><button class="${state.view==='trainerTrainings'?'active':''}" onclick="go('trainerTrainings')"><span class="ico">◫</span>Treeningud</button><button class="${state.view==='members'?'active':''}" onclick="go('members')"><span class="ico">♙</span>Liikmed</button><button class="${state.view==='stats'?'active':''}" onclick="go('stats')"><span class="ico">▤</span>Statistika</button></div>`;return `<div class="nav client"><button class="${state.view==='trainings'?'active':''}" onclick="go('trainings')"><span class="ico">◫</span>Treeningud</button><button class="${state.view==='mine'?'active':''}" onclick="go('mine')"><span class="ico">✓</span>Minu treeningud</button><button class="${state.view==='profile'?'active':''}" onclick="go('profile')"><span class="ico">♙</span>Profiil</button></div>`}
function go(v){state.view=v;state.selected=null;render();scrollTo({top:0,behavior:'smooth'})}
function clientTrainings(){const upcoming=state.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());const registered=upcoming.filter(t=>mine(t)?.status==='confirmed').length;return `<div class="content"><div class="hero"><div class="eyebrow">Järgmised treeningud</div><h1>Vali trenn ja pane nimi kirja.</h1><p>Kohtade arv ja registreerunud inimesed on kõigile grupiliikmetele nähtavad.</p><div class="stats"><div class="mini"><b>${upcoming.length}</b><span>tulevast trenni</span></div><div class="mini"><b>${registered}</b><span>oled kirjas</span></div></div></div><div class="section-head"><h2>Tulevased treeningud</h2><button onclick="refresh()">Värskenda</button></div>${upcoming.length?`<div class="stack">${upcoming.map(trainingCard).join('')}</div>`:`<div class="card empty"><b>Treeninguid pole veel lisatud.</b>Treener lisab järgmise aja siia.</div>`}</div>`}
function trainingCard(t){const d=fmtDate(t.starts_at),c=confirmedFor(t).length,r=mine(t);const label=r?.status==='confirmed'?'✓ Registreeritud':r?.status==='waitlist'?'Ootenimekirjas':c>=t.capacity?'Täis':'Vabu kohti '+(t.capacity-c);const cls=r?.status==='waitlist'?'wait':c>=t.capacity&&!r?'full':r?'':'neutral';return `<div class="card training" onclick="openTraining(${t.id})"><div class="datebox"><b>${d.day}</b><span>${d.mon}</span></div><div><h3>${esc(d.full)}</h3><div class="meta"><span>${fmtTime(t.starts_at)}–${endTime(t)}</span><span>👥 ${c}/${t.capacity}</span><span>${euro(t.price_cents)}</span></div><span class="status ${cls}">${label}</span></div><div class="arrow">›</div></div>`}
function openTraining(id){state.selected=id;render()}
function detailModal(t){const d=fmtDate(t.starts_at),c=confirmedFor(t).length,w=waitFor(t),r=mine(t);const people=confirmedFor(t).map(x=>profileName(x.user_id));const closed=t.registration_closes_at&&new Date()>new Date(t.registration_closes_at);return `<div class="modalwrap" onclick="modalBackdrop(event)"><div class="modal"><div class="modalhandle"></div><button class="close" onclick="closeModal()">×</button><div class="detail-card"><div class="detail-title"><div><div class="eyebrow" style="color:#6b756f">${esc(t.title)}</div><h2>${esc(d.full)}</h2><div class="meta" style="margin-top:5px">${fmtTime(t.starts_at)}–${endTime(t)}</div></div><div class="price">${euro(t.price_cents)}</div></div><div class="facts"><div class="fact"><span class="ficon">👥</span><span><b>${c}/${t.capacity}</b> kohta täidetud</span></div><div class="fact"><span class="ficon">⏱</span><span>${t.duration_minutes} minutit</span></div><div class="fact"><span class="ficon">↩</span><span>Tühistamine kuni ${t.cancellation_hours} h enne trenni</span></div></div><div class="divider"></div><b>Registreerunud (${people.length})</b><div class="people" style="margin-top:10px">${people.length?people.map(n=>`<div class="person"><div class="avatar">${esc(initials(n))}</div>${esc(n)}</div>`).join(''):'<span class="meta">Keegi pole veel registreerunud.</span>'}</div>${w.length?`<div class="note">Ootenimekirjas: ${w.map(x=>esc(profileName(x.user_id))).join(', ')}</div>`:''}${t.note?`<div class="note">${esc(t.note)}</div>`:''}<div class="divider"></div>${r?`<div class="status ${r.status==='waitlist'?'wait':''}" style="margin-bottom:12px">${r.status==='confirmed'?'✓ Oled registreeritud':'Oled ootenimekirjas'}</div><button class="btn danger block" onclick="cancelRegistration(${t.id})">Tühista registreering</button>`:closed?`<button class="btn secondary block" disabled>Registreerimine on lõppenud</button>`:c>=t.capacity?`<button class="btn primary block" onclick="registerTraining(${t.id},false)">Liitu ootenimekirjaga</button>`:`<button class="btn primary block" onclick="showPayment(${t.id})">Registreeru</button>`}</div></div></div>`}
function modalBackdrop(e){if(e.target.classList.contains('modalwrap'))closeModal()}
function closeModal(){state.selected=null;render()}
function showPayment(id){const t=state.trainings.find(x=>x.id===id);state.selected='payment:'+id;render()}
function paymentModal(t){return `<div class="modalwrap" onclick="modalBackdrop(event)"><div class="modal"><div class="modalhandle"></div><button class="close" onclick="closeModal()">×</button><div class="detail-card"><div class="eyebrow" style="color:#6b756f">Registreerimine</div><h2 style="margin:4px 0 4px">${esc(fmtDate(t.starts_at).full)}</h2><div class="meta">${fmtTime(t.starts_at)} · ${euro(t.price_cents)}</div><div class="divider"></div>${state.wallet.credits>0?`<div class="payment-choice"><div class="radio"></div><div><b>Treeningkaart</b><div class="meta">Sul on ${state.wallet.credits} korda alles</div></div></div><button class="btn primary block" onclick="registerTraining(${t.id},true)">Kasuta 1 treeningukord</button><div class="divider"></div>`:''}<div class="payment-choice disabled"><div class="radio"></div><div><b>Kaart / pangalink</b><div class="meta">Montonio või Stripe</div></div></div><div class="payment-info">Päris makseühendus aktiveeritakse pärast kaupmehekonto ühendamist. Praegu saab koha kinnitada maksmata staatusega, et registreerimise loogikat kasutada.</div><button class="btn outline block" onclick="registerTraining(${t.id},false)">Registreeru praegu, makse ootel</button></div></div></div>`}
async function registerTraining(id,useCredit){try{const {data,error}=await sb.rpc('wod_register',{p_training_id:id,p_use_credit:useCredit});if(error)throw error;await loadData();state.selected=null;render();const s=data?.[0]?.registration_status;toast(s==='waitlist'?'Lisatud ootenimekirja.':'Registreering kinnitatud.','good')}catch(e){toast(errText(e),'bad')}}
async function cancelRegistration(id){if(!confirm('Kas tühistada registreering?'))return;try{const {error}=await sb.rpc('wod_cancel_registration',{p_training_id:id});if(error)throw error;await loadData();state.selected=null;render();toast('Registreering tühistatud.','good')}catch(e){toast(errText(e),'bad')}}
function myTrainings(){const list=state.trainings.filter(t=>mine(t)&&new Date(t.starts_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));return `<div class="content"><div class="section-head" style="margin-top:2px"><h2>Minu treeningud</h2></div>${list.length?`<div class="stack">${list.map(trainingCard).join('')}</div>`:`<div class="card empty"><b>Registreeringuid pole.</b>Vali treeningute vaates endale sobiv aeg.</div>`}</div>`}
function profileView(){const attended=state.registrations.filter(r=>r.user_id===state.session.user.id&&r.status==='confirmed').length;return `<div class="content"><div class="card profile-card"><div class="profile-top"><div class="bigavatar">${esc(initials(state.profile.display_name))}</div><div><h2>${esc(state.profile.display_name)}</h2><p>${esc(state.session.user.email||'')}</p></div></div><div class="metric-grid"><div class="metric"><span>Registreeringuid</span><b>${attended}</b></div><div class="metric"><span>Treeningkordi alles</span><b>${state.wallet.credits||0}</b></div></div></div>${!isTrainer()?`<div class="section-head"><h2>Treener</h2></div><div class="card form"><div class="field"><label>Treenerikood</label><input id="trainerCode" type="password" placeholder="Sisesta ainult treenerina"></div><button class="btn outline block" onclick="claimTrainer()">Aktiveeri treeneri vaade</button></div>`:''}<div class="section-head"><h2>Konto</h2></div><div class="card settings"><div class="setting"><span>Nimi</span><button class="btn secondary" style="padding:8px 10px" onclick="renameProfile()">Muuda</button></div><div class="setting"><span>Roll</span><b>${isTrainer()?'Treener':'Klient'}</b></div><div class="setting"><span>Logi välja</span><button class="btn danger" style="padding:8px 10px" onclick="signOut()">Logi välja</button></div></div></div>`}
async function claimTrainer(){const code=document.getElementById('trainerCode')?.value.trim();if(!code)return toast('Sisesta treenerikood.','bad');try{const {data,error}=await sb.rpc('wod_claim_trainer',{claim_code:code,new_display_name:state.profile.display_name});if(error)throw error;if(!data)return toast('Treenerikood ei ole õige.','bad');await loadData();state.view='overview';render();toast('Treeneri vaade aktiveeritud.','good')}catch(e){toast(errText(e),'bad')}}
async function renameProfile(){const n=prompt('Sisesta nimi',state.profile.display_name);if(!n?.trim())return;try{const {error}=await sb.rpc('wod_ensure_profile',{new_display_name:n.trim()});if(error)throw error;await loadData();render();toast('Nimi muudetud.','good')}catch(e){toast(errText(e),'bad')}}
function trainerOverview(){const upcoming=state.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));const t=upcoming[0];if(!t)return `<div class="content"><div class="hero"><div class="eyebrow">Treeneri vaade</div><h1>Lisa esimene treening.</h1><p>Pärast avaldamist näevad grupiliikmed aega ja saavad end registreerida.</p></div><button class="btn primary fab" onclick="go('add')">＋ Lisa treening</button></div>`;const c=confirmedFor(t).length;return `<div class="content"><div class="trainer-hero"><div class="todayline"><div><div class="eyebrow">Järgmine treening</div><h2>${esc(fmtDate(t.starts_at).full)}</h2><div class="meta" style="color:#c5cec9;margin-top:4px">${fmtTime(t.starts_at)}–${endTime(t)}</div></div><div class="bigcount">${c}/${t.capacity}</div></div><div class="capacity"><i style="width:${Math.min(100,100*c/t.capacity)}%"></i></div><div class="trainer-kpis"><div><b>${Math.max(0,t.capacity-c)}</b><span>vaba kohta</span></div><div><b>${waitFor(t).length}</b><span>ootenimekirjas</span></div><div><b>${euro(c*t.price_cents)}</b><span>väärtus</span></div></div></div><button class="btn primary fab" onclick="go('add')">＋ Lisa treening</button><div class="section-head"><h2>Järgmised treeningud</h2></div><div class="stack">${upcoming.slice(0,4).map(t=>trainerCard(t)).join('')}</div></div>`}
function trainerCard(t){const d=fmtDate(t.starts_at),c=confirmedFor(t).length;return `<div class="card training" onclick="openAttendees(${t.id})"><div class="datebox"><b>${d.day}</b><span>${d.mon}</span></div><div><h3>${esc(d.full)}</h3><div class="meta"><span>${fmtTime(t.starts_at)}</span><span>👥 ${c}/${t.capacity}</span></div></div><div class="arrow">›</div></div>`}
function trainerTrainings(){const list=state.trainings.filter(t=>new Date(t.starts_at)>new Date(Date.now()-86400000));return `<div class="content"><div class="section-head" style="margin-top:2px"><h2>Treeningud</h2><button onclick="go('add')">＋ Lisa uus</button></div>${list.length?`<div class="stack">${list.map(trainerCard).join('')}</div>`:`<div class="card empty"><b>Treeninguid pole.</b>Lisa esimene treening.</div>`}</div>`}
function openAttendees(id){state.selected=id;state.view='attendees';render()}
function attendees(){const t=state.trainings.find(x=>x.id===state.selected);if(!t)return trainerTrainings();const confirmed=confirmedFor(t),wait=waitFor(t);return `<div class="content"><button class="btn secondary" style="padding:9px 12px;margin-bottom:12px" onclick="go('trainerTrainings')">‹ Tagasi</button><div class="section-head" style="margin-top:0"><div><h2>${esc(fmtDate(t.starts_at).full)}</h2><div class="meta">${fmtTime(t.starts_at)}–${endTime(t)} · ${confirmed.length}/${t.capacity}</div></div></div><div class="section-head"><h2>Osalejad (${confirmed.length})</h2></div><div class="card listcard">${confirmed.length?confirmed.map(r=>attendeeRow(r)).join(''):'<div class="empty">Osalejaid veel pole.</div>'}</div>${wait.length?`<div class="section-head"><h2>Ootenimekiri (${wait.length})</h2></div><div class="card listcard">${wait.map(r=>attendeeRow(r,true)).join('')}</div>`:''}<div class="section-head"><h2>Kiirülevaade</h2></div><div class="stats-grid"><div class="card statbox"><span>Registreerunud</span><b>${confirmed.length}</b></div><div class="card statbox"><span>Vabu kohti</span><b>${Math.max(0,t.capacity-confirmed.length)}</b></div></div></div>`}
function attendeeRow(r,wait=false){const n=profileName(r.user_id);return `<div class="attendee"><div class="avatar">${esc(initials(n))}</div><div class="name"><b>${esc(n)}</b><span>${wait?'Ootenimekirjas':r.payment_status==='paid'?'Makstud':r.payment_status==='package'?'Treeningkaart':'Makse ootel'}</span></div><div class="check">${wait?'…':'✓'}</div></div>`}
function addTraining(){const tomorrow=new Date(Date.now()+86400000);const date=tomorrow.toISOString().slice(0,10);return `<div class="content"><button class="btn secondary" style="padding:9px 12px;margin-bottom:12px" onclick="go('overview')">‹ Tagasi</button><div class="card form"><div class="section-head" style="margin:0 0 15px"><h2>Lisa treening</h2></div><div class="two"><div class="field"><label>Kuupäev</label><input id="fdate" type="date" value="${date}"></div><div class="field"><label>Kellaaeg</label><input id="ftime" type="time" value="18:30"></div></div><div class="two"><div class="field"><label>Kestus (min)</label><input id="fduration" type="number" value="60" min="15" max="240"></div><div class="field"><label>Kohtade arv</label><input id="fcap" type="number" value="12" min="1" max="100"></div></div><div class="field"><label>Treening</label><input id="ftitle" value="CrossFit"></div><div class="two"><div class="field"><label>Hind (€)</label><input id="fprice" type="number" step="0.01" value="8"></div><div class="field"><label>Registreerimise lõpp</label><input id="freg" type="time" value="16:00"></div></div><div class="field"><label>Tühistamise piir</label><select id="fcancel"><option value="2">2 h enne</option><option value="4" selected>4 h enne</option><option value="6">6 h enne</option><option value="12">12 h enne</option></select></div><div class="field"><label>Märkus</label><textarea id="fnote" placeholder="Näiteks: võta välijalanõud kaasa"></textarea></div><button class="btn primary block" onclick="createTraining()">Avalda treening</button></div></div>`}
function tallinnIso(date,time){return new Date(date+'T'+time+':00+03:00').toISOString()}
async function createTraining(){const v=id=>document.getElementById(id).value;const date=v('fdate'),time=v('ftime');if(!date||!time)return toast('Kuupäev ja kellaaeg on nõutud.','bad');const start=tallinnIso(date,time);const reg=tallinnIso(date,v('freg')||time);const row={created_by:state.session.user.id,title:v('ftitle')||'CrossFit',starts_at:start,duration_minutes:+v('fduration')||60,capacity:+v('fcap')||12,price_cents:Math.round((+v('fprice')||0)*100),registration_closes_at:reg,cancellation_hours:+v('fcancel')||4,note:v('fnote')||null,status:'published'};try{const {error}=await sb.from('wod_trainings').insert(row);if(error)throw error;await loadData();state.view='trainerTrainings';render();toast('Treening avaldatud.','good')}catch(e){toast(errText(e),'bad')}}
function members(){const ids=[...new Set(state.registrations.filter(r=>r.status!=='cancelled').map(r=>r.user_id))];return `<div class="content"><div class="section-head" style="margin-top:2px"><h2>Liikmed</h2></div><div class="card listcard">${ids.length?ids.map(id=>{const n=profileName(id),c=state.registrations.filter(r=>r.user_id===id&&r.status==='confirmed').length;return `<div class="attendee"><div class="avatar">${esc(initials(n))}</div><div class="name"><b>${esc(n)}</b><span>${c} registreeringut</span></div><div class="check">✓</div></div>`}).join(''):'<div class="empty">Liikmeid näidatakse pärast esimesi registreeringuid.</div>'}</div></div>`}
function stats(){const list=state.trainings.filter(t=>t.status==='published'),totals=list.map(t=>confirmedFor(t).length),sum=totals.reduce((a,b)=>a+b,0),avg=totals.length?(sum/totals.length).toFixed(1).replace('.',','):'0',max=totals.length?Math.max(...totals):0,min=totals.length?Math.min(...totals):0,revenue=list.reduce((s,t)=>s+confirmedFor(t).length*t.price_cents,0);const counts={};state.registrations.filter(r=>r.status==='confirmed').forEach(r=>counts[profileName(r.user_id)]=(counts[profileName(r.user_id)]||0)+1);const leaders=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);const top=Math.max(1,...leaders.map(x=>x[1]));return `<div class="content"><div class="section-head" style="margin-top:2px"><h2>Statistika</h2></div><div class="stats-grid"><div class="card statbox"><span>Treeninguid</span><b>${list.length}</b></div><div class="card statbox"><span>Keskmine osalejate arv</span><b>${avg}</b></div><div class="card statbox"><span>Kõige rohkem</span><b>${max}</b></div><div class="card statbox"><span>Kõige vähem</span><b>${min}</b></div><div class="card statbox"><span>Osalemisi kokku</span><b>${sum}</b></div><div class="card statbox"><span>Treeningute väärtus</span><b>${euro(revenue)}</b></div></div><div class="section-head"><h2>Aktiivseimad liikmed</h2></div><div class="card barlist">${leaders.length?leaders.map(([n,c])=>`<div class="barrow"><b>${esc(n)}</b><div class="bar"><i style="width:${100*c/top}%"></i></div><span>${c}</span></div>`).join(''):'<div class="empty">Statistika tekib registreeringute lisandudes.</div>'}</div></div>`}
function render(){if(state.loading){root.innerHTML='<div class="app"><div class="loader">WOD laadib…</div></div>';return}if(!state.session){root.innerHTML=authView();return}let body='';if(isTrainer()){if(!['overview','trainerTrainings','members','stats','attendees','add'].includes(state.view))state.view='overview';body=state.view==='overview'?trainerOverview():state.view==='trainerTrainings'?trainerTrainings():state.view==='members'?members():state.view==='stats'?stats():state.view==='attendees'?attendees():addTraining()}else{if(!['trainings','mine','profile'].includes(state.view))state.view='trainings';body=state.view==='trainings'?clientTrainings():state.view==='mine'?myTrainings():profileView()}root.innerHTML=`<div class="app">${top()}${body}${nav()}</div>`;if(typeof state.selected==='number'){const t=state.trainings.find(x=>x.id===state.selected);if(t)root.insertAdjacentHTML('beforeend',detailModal(t))}else if(typeof state.selected==='string'&&state.selected.startsWith('payment:')){const id=+state.selected.split(':')[1];const t=state.trainings.find(x=>x.id===id);if(t)root.insertAdjacentHTML('beforeend',paymentModal(t))}}
sb.auth.onAuthStateChange(async(event,session)=>{state.session=session;if(event==='SIGNED_OUT'){state.profile=null;state.loading=false;render();return}if(session&&['SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){try{await ensureProfile();await loadData();state.loading=false;render()}catch(e){console.error(e)}}});
boot().catch(e=>{state.loading=false;render();setTimeout(()=>toast(errText(e),'bad'),200)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
