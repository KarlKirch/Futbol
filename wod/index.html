<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101612">
<title>WOD</title>
<style>
:root{--g:#119447;--g2:#0b7136;--bg:#f2f5f3;--card:#fff;--text:#152019;--muted:#6d7771;--line:#dce4df;--dark:#101612;--red:#b93b41;--amber:#9b6418;--blue:#285f8f}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,textarea{font:inherit}.app{max-width:520px;min-height:100svh;margin:auto;background:var(--bg)}.auth{min-height:100svh;background:linear-gradient(150deg,#0f1511,#1f2c24);padding:24px;display:flex;align-items:center}.authbox{width:100%;max-width:420px;margin:auto}.logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#24bd65,#087233);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:950}.auth h1{color:#fff;font-size:35px;margin:18px 0 4px}.auth p{color:#c6cfca;margin:0 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px}.tabs{display:flex;background:#edf1ef;border-radius:13px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px 2px}.field input,.field textarea{width:100%;border:1px solid #d4ded8;background:#fbfcfb;border-radius:13px;padding:12px;outline:none}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:linear-gradient(#16a550,#0d873f);color:#fff}.secondary{background:#e9efeb;color:#26312b}.danger{background:#fdebed;color:var(--red)}.outline{background:#fff;border:1px solid var(--line);color:#26312b}.block{width:100%}.notice{padding:11px;border-radius:12px;background:#edf6ef;color:#31543d;font-size:12px;margin-bottom:10px}.notice.bad{background:#fff0f1;color:#81383c}.top{position:sticky;top:0;z-index:5;background:#101612;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 14px #0002}.top b{font-size:21px}.content{padding:16px 16px 36px}.hero{background:linear-gradient(135deg,#111914,#1b2d21);color:#fff;border-radius:24px;padding:21px;margin-bottom:16px}.hero h1{margin:4px 0 8px;font-size:26px}.hero p{margin:0;color:#c6d0ca;font-size:14px}.hero .mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:18px;margin:0}.stack{display:grid;gap:10px}.training{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.training h3{margin:0 0 5px}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.people{font-size:12px;color:#415047;margin-top:9px;line-height:1.45}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions .btn{flex:1;min-width:120px}.empty{text-align:center;color:var(--muted);padding:30px 18px;background:#fff;border:1px solid var(--line);border-radius:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:#edf1ef;color:#415047}.pill.green{background:#e7f7ed;color:#11683a}.pill.amber{background:#fff4df;color:var(--amber)}.pill.red{background:#fdebed;color:var(--red)}.pill.blue{background:#e9f2fb;color:var(--blue)}.editbox{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}.subtle{font-size:11px;color:var(--muted);margin-top:7px}.payline{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}@media(max-width:380px){.formgrid{grid-template-columns:1fr}.actions .btn{min-width:100%}}
</style>
</head>
<body>
<div id="root" class="app">
  <div class="auth" id="authScreen">
    <div class="authbox">
      <div class="logo">W</div>
      <h1>WOD</h1>
      <p>CrossFit treeningutele registreerimine.</p>
      <div class="card">
        <div class="tabs"><button id="tabLogin" class="on">Logi sisse</button><button id="tabSignup">Loo konto</button></div>
        <div id="message"></div>
        <div id="nameField" class="field hidden"><label>Ees- ja perekonnanimi</label><input id="name" autocomplete="name"></div>
        <div class="field"><label>E-post</label><input id="email" type="email" autocomplete="email"></div>
        <div class="field"><label>Parool</label><input id="password" type="password" autocomplete="current-password"></div>
        <button id="authButton" class="btn primary block">Logi sisse</button>
      </div>
    </div>
  </div>
  <div id="mainScreen" class="hidden"></div>
</div>
<script>
'use strict';
const BASE='https://aanxpugvehwtcwwpefwx.supabase.co';
const KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const SIGNUP_REDIRECT='https://karlkirch.github.io/Futbol/wod/';
const TZ='Europe/Tallinn';
let mode='login',session=null,profile=null,trainings=[],registrations=[],profiles=[],walletCredits=0,editingId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>(Number(c||0)/100).toFixed(2).replace('.',',')+' €';
function headers(token){const h={'apikey':KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}
async function request(url,opt={}){const r=await fetch(url,opt);const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok){const msg=(data&&typeof data==='object'&&(data.message||data.msg||data.error_description||data.error))||text||('HTTP '+r.status);throw new Error(msg)}return data}
function friendlyAuthError(msg){const s=String(msg||'');if(/duplicate key|already registered|already exists|users_email/i.test(s))return 'Selle e-postiga konto on juba olemas. Vali „Logi sisse“.';if(/invalid login credentials/i.test(s))return 'E-post või parool on vale.';if(/email not confirmed/i.test(s))return 'E-post ei ole veel kinnitatud. Ava kinnituskiri ja vajuta kinnitamise lingile.';return s||'Sisselogimine ebaõnnestus.'}
function showMessage(text,bad=false){$('message').innerHTML=text?`<div class="notice${bad?' bad':''}">${esc(text)}</div>`:''}
function setMode(next){mode=next;$('tabLogin').classList.toggle('on',mode==='login');$('tabSignup').classList.toggle('on',mode==='signup');$('nameField').classList.toggle('hidden',mode!=='signup');$('authButton').textContent=mode==='login'?'Logi sisse':'Loo konto';$('password').autocomplete=mode==='login'?'current-password':'new-password';showMessage('')}
$('tabLogin').onclick=()=>setMode('login');$('tabSignup').onclick=()=>setMode('signup');
async function authSubmit(){const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||!password||(mode==='signup'&&!name)){showMessage('Täida kõik väljad.',true);return}showMessage('Palun oota…');try{let data;if(mode==='signup'){data=await request(BASE+'/auth/v1/signup?redirect_to='+encodeURIComponent(SIGNUP_REDIRECT),{method:'POST',headers:headers(),body:JSON.stringify({email,password,data:{display_name:name}})});if(!data.access_token){showMessage('Konto loodud. Kinnita e-postis saadetud link ja logi seejärel sisse.');return}}else{data=await request(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify({email,password})})}session=data;localStorage.setItem('wod_session',JSON.stringify(data));await loadApp()}catch(e){showMessage(friendlyAuthError(e.message),true)}}
$('authButton').onclick=authSubmit;
async function refreshSession(){if(!session?.refresh_token)return false;try{const data=await request(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:headers(),body:JSON.stringify({refresh_token:session.refresh_token})});session=data;localStorage.setItem('wod_session',JSON.stringify(data));return true}catch(_){localStorage.removeItem('wod_session');session=null;return false}}
async function api(path,opt={}){if(!session?.access_token)throw new Error('Sessioon puudub');return request(BASE+'/rest/v1/'+path,{...opt,headers:{...headers(session.access_token),...(opt.headers||{})}})}
async function rpc(name,body){return api('rpc/'+name,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)})}
async function ensureProfile(){let rows=await api('wod_profiles?select=user_id,display_name,role&user_id=eq.'+session.user.id);if(!rows.length){const n=(session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'Kasutaja').trim();await rpc('wod_ensure_profile',{new_display_name:n});rows=await api('wod_profiles?select=user_id,display_name,role&user_id=eq.'+session.user.id)}profile=rows[0]}
async function loadData(){const now=new Date(Date.now()-86400000).toISOString();const results=await Promise.all([api('wod_trainings?select=*&starts_at=gte.'+encodeURIComponent(now)+'&order=starts_at.asc'),api('wod_registrations?select=*&order=created_at.asc'),api('wod_profiles?select=user_id,display_name,role&order=display_name.asc'),api('wod_wallets?select=credits&user_id=eq.'+session.user.id)]);trainings=results[0];registrations=results[1];profiles=results[2];walletCredits=results[3]?.[0]?.credits||0}
function pname(id){return profiles.find(p=>p.user_id===id)?.display_name||'Kasutaja'}
function activeRegs(t){return registrations.filter(r=>r.training_id===t.id&&r.status!=='cancelled')}
function mine(t){return registrations.find(r=>r.training_id===t.id&&r.user_id===session.user.id&&r.status!=='cancelled')}
function confirmed(t){return registrations.filter(r=>r.training_id===t.id&&r.status==='confirmed')}
function waitlisted(t){return registrations.filter(r=>r.training_id===t.id&&r.status==='waitlist')}
function dateText(iso){return new Intl.DateTimeFormat('et-EE',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function tallinnParts(iso){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(iso));const o={};parts.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});return{date:`${o.year}-${o.month}-${o.day}`,time:`${o.hour}:${o.minute}`}}
function tzOffsetMs(date){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);const o={};parts.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});return Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second)-date.getTime()}
function tallinnToISO(dateStr,timeStr){const [y,m,d]=dateStr.split('-').map(Number),[h,mi]=timeStr.split(':').map(Number);const wall=Date.UTC(y,m-1,d,h,mi,0);let probe=new Date(wall),offset=tzOffsetMs(probe),utc=new Date(wall-offset);offset=tzOffsetMs(utc);return new Date(wall-offset).toISOString()}
function paymentPill(status){const map={unpaid:['Tasumata','amber'],pending:['Makse ootel','amber'],paid:['Tasutud','green'],package:['Treeningkord','blue'],refund_pending:['Tagastus ootel','amber'],refunded:['Tagastatud','green']};const v=map[status]||[status,''];return `<span class="pill ${v[1]}">${esc(v[0])}</span>`}
async function register(id,useCredit=false){try{const result=await rpc('wod_register',{p_training_id:id,p_use_credit:useCredit});await loadData();renderMain();const r=Array.isArray(result)?result[0]:result;if(r?.registration_status==='waitlist')alert('Treening on täis. Sind lisati ootenimekirja.')}catch(e){alert(e.message)}}
async function cancelReg(id){if(!confirm('Kas soovid registreeringu tühistada?'))return;try{await rpc('wod_cancel_registration',{p_training_id:id});await loadData();renderMain()}catch(e){alert(e.message)}}
async function createTraining(){const date=$('tdate').value,time=$('ttime').value,title=$('ttitle').value.trim()||'CrossFit',cap=Number($('tcap').value||12),price=Math.round(Number($('tprice').value||0)*100),note=$('tnote').value.trim();if(!date||!time){alert('Sisesta kuupäev ja kellaaeg.');return}if(cap<1){alert('Kohtade arv peab olema vähemalt 1.');return}const starts=tallinnToISO(date,time),close=new Date(new Date(starts).getTime()-2*3600000).toISOString();try{await api('wod_trainings',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({created_by:session.user.id,title,starts_at:starts,duration_minutes:60,capacity:cap,price_cents:price,registration_closes_at:close,cancellation_hours:4,note:note||null,status:'published'})});await loadData();renderMain()}catch(e){alert(e.message)}}
function startEdit(id){editingId=id;renderMain()}
function stopEdit(){editingId=null;renderMain()}
async function saveTraining(id){const t=trainings.find(x=>x.id===id);if(!t)return;const date=$('edate').value,time=$('etime').value,title=$('etitle').value.trim()||'CrossFit',cap=Number($('ecap').value||12),price=Math.round(Number($('eprice').value||0)*100),note=$('enote').value.trim(),c=confirmed(t).length;if(cap<c){alert(`Kohtade arv ei saa olla väiksem kui juba registreerunute arv (${c}).`);return}const starts=tallinnToISO(date,time),close=new Date(new Date(starts).getTime()-2*3600000).toISOString();try{await api('wod_trainings?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({title,starts_at:starts,capacity:cap,price_cents:price,registration_closes_at:close,note:note||null})});editingId=null;await loadData();renderMain()}catch(e){alert(e.message)}}
async function cancelTraining(id){if(!confirm('Kas tühistada kogu treening? Registreeringud tühistatakse ja paketist kasutatud treeningkorrad tagastatakse.'))return;try{await rpc('wod_cancel_training',{p_training_id:id});editingId=null;await loadData();renderMain()}catch(e){alert(e.message)}}
async function deleteTraining(id){const t=trainings.find(x=>x.id===id);if(!t)return;if(activeRegs(t).length){alert('Sellel treeningul on registreeringuid. Kasuta „Tühista trenn“ nuppu.');return}if(!confirm('Kas kustutada see treening lõplikult?'))return;try{await api('wod_trainings?id=eq.'+id,{method:'DELETE'});editingId=null;await loadData();renderMain()}catch(e){alert(e.message)}}
function editHtml(t){if(editingId!==t.id)return'';const p=tallinnParts(t.starts_at);return `<div class="editbox"><div class="formgrid"><div class="field"><label>Kuupäev</label><input id="edate" type="date" value="${esc(p.date)}"></div><div class="field"><label>Kellaaeg</label><input id="etime" type="time" value="${esc(p.time)}"></div></div><div class="field"><label>Nimetus</label><input id="etitle" value="${esc(t.title)}"></div><div class="formgrid"><div class="field"><label>Kohti</label><input id="ecap" type="number" min="1" value="${t.capacity}"></div><div class="field"><label>Hind (€)</label><input id="eprice" type="number" step="0.01" min="0" value="${(Number(t.price_cents||0)/100).toFixed(2)}"></div></div><div class="field"><label>Märkus</label><textarea id="enote">${esc(t.note||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="saveTraining(${t.id})">Salvesta</button><button class="btn secondary" onclick="stopEdit()">Loobu</button></div></div>`}
function trainingHtml(t,trainer){const c=confirmed(t),w=waitlisted(t),m=mine(t),full=c.length>=t.capacity,confirmedNames=c.map(r=>esc(pname(r.user_id))).join(', ')||'Keegi pole veel registreerunud',waitNames=w.map((r,i)=>`${i+1}. ${esc(pname(r.user_id))}`).join(', ');let action='';if(trainer){action=`<div class="actions"><button class="btn outline" onclick="startEdit(${t.id})">Muuda</button>${activeRegs(t).length?`<button class="btn danger" onclick="cancelTraining(${t.id})">Tühista trenn</button>`:`<button class="btn danger" onclick="deleteTraining(${t.id})">Kustuta</button>`}</div>${editHtml(t)}`}else if(m){action=`<div class="payline"><span class="pill ${m.status==='confirmed'?'green':'amber'}">${m.status==='confirmed'?'Registreeritud':'Ootenimekirjas'}</span>${paymentPill(m.payment_status)}</div><div class="actions"><button class="btn danger" onclick="cancelReg(${t.id})">Tühista registreering</button></div>`}else{const normalLabel=full?'Liitu ootenimekirjaga':'Registreeru';action=`<div class="actions"><button class="btn primary" onclick="register(${t.id},false)">${normalLabel}</button>${!full&&walletCredits>0?`<button class="btn outline" onclick="register(${t.id},true)">Kasuta treeningkorda</button>`:''}</div>`}return `<div class="training"><h3>${esc(t.title)}</h3><div class="meta"><span>${esc(dateText(t.starts_at))}</span><span>${c.length}/${t.capacity} kohta</span><span>${money(t.price_cents)}</span>${w.length?`<span>Ootel ${w.length}</span>`:''}</div>${t.note?`<div class="subtle">${esc(t.note)}</div>`:''}<div class="people"><b>Registreerunud:</b> ${confirmedNames}${w.length?`<br><b>Ootenimekiri:</b> ${waitNames}`:''}</div>${action}</div>`}
function renderMain(){const trainer=profile?.role==='trainer';$('authScreen').classList.add('hidden');const el=$('mainScreen');el.classList.remove('hidden');const upcoming=trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());el.innerHTML=`<div class="top"><div><b>WOD</b><div style="font-size:11px;color:#aeb8b2">${trainer?'Treener':'Treeningud'}</div></div><button class="btn secondary" onclick="logout()">Logi välja</button></div><div class="content"><div class="hero"><h1>${trainer?'Treeneri ülevaade':'Tulevased treeningud'}</h1><p>${trainer?'Lisa, muuda ja halda treeninguid ning osalejaid.':'Vali sobiv treening ja registreeru.'}</p>${!trainer?`<div class="mini"><span class="pill blue">Treeningkordi: ${walletCredits}</span></div>`:''}</div>${trainer?`<div class="section"><h2>Lisa treening</h2></div><div class="card"><div class="formgrid"><div class="field"><label>Kuupäev</label><input id="tdate" type="date"></div><div class="field"><label>Kellaaeg</label><input id="ttime" type="time" value="18:30"></div></div><div class="field"><label>Nimetus</label><input id="ttitle" value="CrossFit"></div><div class="formgrid"><div class="field"><label>Kohti</label><input id="tcap" type="number" min="1" value="12"></div><div class="field"><label>Hind (€)</label><input id="tprice" type="number" step="0.01" min="0" value="8"></div></div><div class="field"><label>Märkus</label><textarea id="tnote"></textarea></div><button class="btn primary block" onclick="createTraining()">Avalda treening</button></div>`:''}<div class="section"><h2>Tulevased treeningud</h2></div><div class="stack">${upcoming.length?upcoming.map(t=>trainingHtml(t,trainer)).join(''):'<div class="empty">Treeninguid pole veel lisatud.</div>'}</div></div>`}
async function loadApp(){try{await ensureProfile();await loadData();renderMain()}catch(e){showMessage(e.message||'Andmete laadimine ebaõnnestus.',true);$('authScreen').classList.remove('hidden');$('mainScreen').classList.add('hidden')}}
async function logout(){try{if(session?.access_token)await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:headers(session.access_token)})}catch(_){}localStorage.removeItem('wod_session');session=null;profile=null;trainings=[];registrations=[];profiles=[];walletCredits=0;editingId=null;$('mainScreen').classList.add('hidden');$('authScreen').classList.remove('hidden');showMessage('')}
window.register=register;window.cancelReg=cancelReg;window.createTraining=createTraining;window.startEdit=startEdit;window.stopEdit=stopEdit;window.saveTraining=saveTraining;window.cancelTraining=cancelTraining;window.deleteTraining=deleteTraining;window.logout=logout;
(async function boot(){try{const raw=localStorage.getItem('wod_session');if(raw){session=JSON.parse(raw);if(session?.refresh_token&&await refreshSession()){await loadApp();return}}}catch(_){localStorage.removeItem('wod_session')}setMode('login')})();
</script>
</body>
</html>
