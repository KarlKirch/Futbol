<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101612">
<title>WOD</title>
<style>
:root{--g:#119447;--g2:#0b7136;--bg:#f2f5f3;--card:#fff;--text:#152019;--muted:#6d7771;--line:#dce4df;--dark:#101612;--red:#b93b41}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:520px;min-height:100svh;margin:auto;background:var(--bg);position:relative}.top{position:sticky;top:0;z-index:10;background:var(--dark);color:#fff;padding:16px}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:21px}.brand small{display:block;color:#aeb8b2;font-size:11px}.name{font-size:12px;background:#26302b;padding:7px 10px;border-radius:999px}.content{padding:16px 16px 100px}.hero{background:linear-gradient(135deg,#111914,#1b2d21);color:#fff;border-radius:24px;padding:21px;margin-bottom:16px}.hero h1{margin:4px 0 8px;font-size:27px}.hero p{margin:0;color:#c6d0ca;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.stat{background:#ffffff12;border:1px solid #ffffff17;border-radius:15px;padding:11px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#cbd3cf}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:18px;margin:0}.link{border:0;background:none;color:var(--g2);font-weight:800}.stack{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px}.training{padding:15px;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.date{height:58px;border-radius:15px;background:#eaf6ee;display:grid;place-items:center;text-align:center;color:#0c7736;font-weight:900}.date b{font-size:22px;line-height:1}.date span{font-size:10px;text-transform:uppercase}.training h3{margin:0 0 4px;font-size:15px}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;margin-top:7px;border-radius:999px;padding:5px 8px;background:#edf7f0;color:#0b7735;font-size:11px;font-weight:800}.badge.wait{background:#fff4dd;color:#8a5b10}.badge.full{background:#fdebee;color:#9c3036}.arrow{width:34px;height:34px;border:0;border-radius:11px;background:#ecf6ef;color:var(--g2);font-size:22px}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850}.primary{background:linear-gradient(#16a550,#0d873f);color:#fff}.secondary{background:#e9efeb;color:#26312b}.danger{background:#fdebed;color:var(--red)}.block{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav.client{grid-template-columns:repeat(3,1fr)}.nav.trainer{grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:8px 3px;border-radius:12px;color:#6c766f;font-size:10px;font-weight:800}.nav button.active{background:#eaf6ee;color:var(--g2)}.auth{min-height:100svh;background:linear-gradient(150deg,#0f1511,#1f2c24);padding:24px;display:flex;align-items:center}.authbox{width:100%;max-width:420px;margin:auto}.logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#24bd65,#087233);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:950}.auth h1{color:#fff;font-size:35px;margin:18px 0 4px}.auth>div>p{color:#c6cfca;margin:0 0 18px}.authcard{background:#fff;border-radius:24px;padding:17px}.tabs{display:flex;background:#edf1ef;border-radius:13px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #d4ded8;background:#fbfcfb;border-radius:13px;padding:12px;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:11px;border-radius:12px;background:#edf6ef;color:#31543d;font-size:12px;margin-bottom:10px}.notice.bad{background:#fff0f1;color:#81383c}.modalbg{position:fixed;inset:0;background:#08100bb2;z-index:40;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(520px,100%);max-height:91svh;overflow:auto;background:var(--bg);border-radius:25px 25px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}.modal h2{margin:4px 0}.close{float:right;border:0;background:#e5ebe7;width:36px;height:36px;border-radius:11px;font-size:20px}.people{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.person{background:#eef3f0;border-radius:999px;padding:6px 9px;font-size:12px}.divider{height:1px;background:var(--line);margin:15px 0}.listrow{display:flex;align-items:center;gap:10px;padding:13px 15px}.listrow+.listrow{border-top:1px solid var(--line)}.avatar{width:34px;height:34px;border-radius:50%;background:#dceee3;display:grid;place-items:center;font-size:11px;font-weight:900}.grow{flex:1}.grow b{display:block}.grow span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:14px}.box span{display:block;color:var(--muted);font-size:11px}.box b{font-size:23px}.empty{text-align:center;color:var(--muted);padding:32px 18px}.loader{padding:50px;text-align:center}.toast{position:fixed;z-index:90;left:50%;bottom:88px;transform:translateX(-50%);width:min(470px,calc(100% - 30px));padding:12px 14px;border-radius:13px;background:#14221a;color:#fff;font-size:13px}.toast.bad{background:#8b3035}@media(min-width:700px){body{padding:22px 0}.app{border-radius:26px;overflow:hidden;min-height:calc(100svh - 44px)}.nav{bottom:22px;border-radius:0 0 26px 26px}.modalbg{align-items:center}.modal{border-radius:25px;max-height:90svh}}
</style>
</head>
<body><div id="root"><div class="app"><div class="loader">WOD käivitub…</div></div></div>
<script>
(async()=>{try{if('serviceWorker'in navigator&&!localStorage.getItem('wod_sw_cleanup_v3')){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{if(new URL(r.scope).pathname.startsWith('/Futbol/'))await r.unregister()}catch(_){}}localStorage.setItem('wod_sw_cleanup_v3','1')}}catch(_){}})();
const BASE='https://aanxpugvehwtcwwpefwx.supabase.co';
const KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const root=document.getElementById('root');
const S={session:null,profile:null,wallet:{credits:0},trainings:[],regs:[],profiles:[],view:'trainings',selected:null,authMode:'login',loading:true};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=c=>(Number(c||0)/100).toFixed(2).replace('.',',')+' €';
const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const fmtDate=iso=>{const d=new Date(iso);return{day:new Intl.DateTimeFormat('et-EE',{day:'2-digit'}).format(d),mon:new Intl.DateTimeFormat('et-EE',{month:'short'}).format(d).replace('.',''),full:new Intl.DateTimeFormat('et-EE',{weekday:'long',day:'numeric',month:'long'}).format(d)}};
const fmtTime=iso=>new Intl.DateTimeFormat('et-EE',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));
const endTime=t=>{const d=new Date(t.starts_at);d.setMinutes(d.getMinutes()+t.duration_minutes);return fmtTime(d)};
function toast(m,bad=false){const x=document.createElement('div');x.className='toast'+(bad?' bad':'');x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function saveSession(s){S.session=s;localStorage.setItem('wod_session_v3',JSON.stringify(s))}
function clearSession(){S.session=null;localStorage.removeItem('wod_session_v3')}
function authHeaders(token){const h={'apikey':KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}
async function jsonFetch(url,opt={}){const r=await fetch(url,opt);const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok){const msg=(data&&typeof data==='object'&&(data.msg||data.message||data.error_description||data.error))||txt||('HTTP '+r.status);const e=new Error(msg);e.status=r.status;throw e}return data}
async function refreshToken(){if(!S.session?.refresh_token)throw new Error('Sessioon puudub');const d=await jsonFetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:authHeaders(),body:JSON.stringify({refresh_token:S.session.refresh_token})});saveSession(d);return d}
async function ensureValid(){if(!S.session?.access_token)return false;try{await jsonFetch(BASE+'/auth/v1/user',{headers:authHeaders(S.session.access_token)});return true}catch(e){if(e.status===401){try{await refreshToken();return true}catch(_){clearSession();return false}}throw e}}
async function rest(path,opt={}){if(!S.session?.access_token)throw new Error('Logi sisse');const headers={...authHeaders(S.session.access_token),...(opt.headers||{})};try{return await jsonFetch(BASE+'/rest/v1/'+path,{...opt,headers})}catch(e){if(e.status===401){await refreshToken();return jsonFetch(BASE+'/rest/v1/'+path,{...opt,headers:{...authHeaders(S.session.access_token),...(opt.headers||{})}})}throw e}}
async function rpc(name,body){return rest('rpc/'+name,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)})}
function isTrainer(){return S.profile?.role==='trainer'}
function mine(t){return S.regs.find(r=>r.training_id===t.id&&r.user_id===S.session?.user?.id&&r.status!=='cancelled')}
function regsFor(t){return S.regs.filter(r=>r.training_id===t.id&&r.status!=='cancelled')}
function conf(t){return regsFor(t).filter(r=>r.status==='confirmed')}
function wait(t){return regsFor(t).filter(r=>r.status==='waitlist')}
function pname(id){return S.profiles.find(p=>p.user_id===id)?.display_name||'Kasutaja'}
async function ensureProfile(){const uid=S.session.user.id;let a=await rest('wod_profiles?select=user_id,display_name,role&user_id=eq.'+uid);if(!a.length){const name=(S.session.user.user_metadata?.display_name||S.session.user.email?.split('@')[0]||'Kasutaja').trim();await rpc('wod_ensure_profile',{new_display_name:name});a=await rest('wod_profiles?select=user_id,display_name,role&user_id=eq.'+uid)}S.profile=a[0]}
async function loadData(){const now=new Date(Date.now()-86400000).toISOString();const [t,r,p,w]=await Promise.all([rest('wod_trainings?select=*&starts_at=gte.'+encodeURIComponent(now)+'&order=starts_at.asc'),rest('wod_registrations?select=*&status=neq.cancelled&order=created_at.asc'),rest('wod_profiles?select=user_id,display_name,role&order=display_name.asc'),rest('wod_wallets?select=credits&user_id=eq.'+S.session.user.id)]);S.trainings=t||[];S.regs=r||[];S.profiles=p||[];S.wallet=w?.[0]||{credits:0};S.profile=S.profiles.find(x=>x.user_id===S.session.user.id)||S.profile}
async function boot(){try{const raw=localStorage.getItem('wod_session_v3');if(raw){try{S.session=JSON.parse(raw)}catch{clearSession()}}if(S.session&&await ensureValid()){await ensureProfile();await loadData()}else clearSession()}catch(e){console.error(e);clearSession()}S.loading=false;render()}
function setAuth(m){S.authMode=m;render()}
function authView(){return `<div class="auth"><div class="authbox"><div class="logo">W</div><h1>WOD</h1><p>CrossFit treeningutele registreerimine.</p><div class="authcard"><div class="tabs"><button class="${S.authMode==='login'?'on':''}" onclick="setAuth('login')">Logi sisse</button><button class="${S.authMode==='signup'?'on':''}" onclick="setAuth('signup')">Loo konto</button></div><div id="msg"></div>${S.authMode==='signup'?'<div class="field"><label>Ees- ja perekonnanimi</label><input id="nm" autocomplete="name"></div>':''}<div class="field"><label>E-post</label><input id="em" type="email" autocomplete="email"></div><div class="field"><label>Parool</label><input id="pw" type="password" autocomplete="${S.authMode==='login'?'current-password':'new-password'}"></div><button class="btn primary block" onclick="authSubmit()">${S.authMode==='login'?'Logi sisse':'Loo konto'}</button></div></div></div>`}
async function authSubmit(){const msg=document.getElementById('msg'),email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value,name=document.getElementById('nm')?.value.trim();if(!email||!password||(S.authMode==='signup'&&!name)){msg.innerHTML='<div class="notice bad">Täida kõik väljad.</div>';return}msg.innerHTML='<div class="notice">Palun oota…</div>';try{if(S.authMode==='signup'){const d=await jsonFetch(BASE+'/auth/v1/signup',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password,data:{display_name:name}})});if(!d.access_token){msg.innerHTML='<div class="notice">Konto loodud. Kinnita e-postis saadetud link ja logi seejärel sisse.</div>';return}saveSession(d)}else{const d=await jsonFetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});saveSession(d)}await ensureProfile();await loadData();S.view=isTrainer()?'overview':'trainings';render()}catch(e){msg.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}}
async function logout(){try{if(S.session?.access_token)await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:authHeaders(S.session.access_token)})}catch(_){}clearSession();S.profile=null;render()}
function top(){return `<div class="top"><div class="brand"><div><b>WOD</b><small>${isTrainer()?'Treener':'Treeningud'}</small></div><span class="name">${esc(S.profile?.display_name||'')}</span></div></div>`}
function nav(){if(isTrainer())return `<div class="nav trainer"><button class="${S.view==='overview'?'active':''}" onclick="go('overview')">Ülevaade</button><button class="${S.view==='trainerTrainings'?'active':''}" onclick="go('trainerTrainings')">Treeningud</button><button class="${S.view==='members'?'active':''}" onclick="go('members')">Liikmed</button><button class="${S.view==='stats'?'active':''}" onclick="go('stats')">Statistika</button></div>`;return `<div class="nav client"><button class="${S.view==='trainings'?'active':''}" onclick="go('trainings')">Treeningud</button><button class="${S.view==='mine'?'active':''}" onclick="go('mine')">Minu treeningud</button><button class="${S.view==='profile'?'active':''}" onclick="go('profile')">Profiil</button></div>`}
function go(v){S.view=v;S.selected=null;render();scrollTo(0,0)}
function card(t){const d=fmtDate(t.starts_at),c=conf(t).length,m=mine(t);let badge=m?.status==='confirmed'?'✓ Registreeritud':m?.status==='waitlist'?'Ootenimekirjas':c>=t.capacity?'Täis':'Vabu kohti '+(t.capacity-c);let cls=m?.status==='waitlist'?'wait':c>=t.capacity&&!m?'full':'';return `<div class="card training"><div class="date"><b>${d.day}</b><span>${d.mon}</span></div><div onclick="openTraining(${t.id})"><h3>${esc(d.full)}</h3><div class="meta"><span>${fmtTime(t.starts_at)}–${endTime(t)}</span><span>👥 ${c}/${t.capacity}</span><span>${euro(t.price_cents)}</span></div><span class="badge ${cls}">${badge}</span></div><button class="arrow" onclick="openTraining(${t.id})">›</button></div>`}
function trainingsView(){const list=S.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());return `<div class="content"><div class="hero"><small>JÄRGMISED TREENINGUD</small><h1>Vali trenn ja pane nimi kirja.</h1><p>Kõik grupiliikmed näevad, kes on registreerunud.</p><div class="stats"><div class="stat"><b>${list.length}</b><span>tulevast trenni</span></div><div class="stat"><b>${list.filter(t=>mine(t)?.status==='confirmed').length}</b><span>oled kirjas</span></div></div></div><div class="section"><h2>Tulevased treeningud</h2><button class="link" onclick="refreshData()">Värskenda</button></div><div class="stack">${list.length?list.map(card).join(''):'<div class="card empty">Treeninguid pole veel lisatud.</div>'}</div></div>`}
function openTraining(id){S.selected=id;render()}
function modal(t){const d=fmtDate(t.starts_at),c=conf(t).length,m=mine(t),names=conf(t).map(r=>pname(r.user_id));return `<div class="modalbg" onclick="if(event.target===this){S.selected=null;render()}"><div class="modal"><button class="close" onclick="S.selected=null;render()">×</button><small>${esc(t.title)}</small><h2>${esc(d.full)}</h2><div class="meta">${fmtTime(t.starts_at)}–${endTime(t)} · ${euro(t.price_cents)} · ${c}/${t.capacity} kohta</div><div class="divider"></div><b>Registreerunud (${names.length})</b><div class="people">${names.length?names.map(n=>'<span class="person">'+esc(n)+'</span>').join(''):'<span class="meta">Keegi pole veel registreerunud.</span>'}</div>${wait(t).length?'<div class="notice" style="margin-top:12px">Ootenimekirjas: '+wait(t).map(r=>esc(pname(r.user_id))).join(', ')+'</div>':''}${t.note?'<div class="notice" style="margin-top:12px">'+esc(t.note)+'</div>':''}<div class="divider"></div>${m?'<span class="badge '+(m.status==='waitlist'?'wait':'')+'">'+(m.status==='confirmed'?'✓ Oled registreeritud':'Oled ootenimekirjas')+'</span><div style="height:10px"></div><button class="btn danger block" onclick="cancelReg('+t.id+')">Tühista registreering</button>':c>=t.capacity?'<button class="btn primary block" onclick="register('+t.id+',false)">Liitu ootenimekirjaga</button>':'<button class="btn primary block" onclick="showPayment('+t.id+')">Registreeru</button>'}</div></div>`}
function showPayment(id){S.selected='pay:'+id;render()}
function payModal(t){return `<div class="modalbg"><div class="modal"><button class="close" onclick="S.selected=null;render()">×</button><small>REGISTREERIMINE</small><h2>${esc(fmtDate(t.starts_at).full)}</h2><div class="meta">${fmtTime(t.starts_at)} · ${euro(t.price_cents)}</div><div class="divider"></div>${S.wallet.credits>0?'<div class="notice">Treeningkaardil on '+S.wallet.credits+' korda.</div><button class="btn primary block" onclick="register('+t.id+',true)">Kasuta 1 treeningukord</button><div class="divider"></div>':''}<div class="notice">Päris kaardi- ja pangamakse ühendame pärast Montonio või Stripe kaupmehekonto lisamist.</div><button class="btn secondary block" onclick="register(${t.id},false)">Registreeru, makse ootel</button></div></div>`}
async function register(id,useCredit){try{await rpc('wod_register',{p_training_id:id,p_use_credit:useCredit});await loadData();S.selected=null;render();toast('Registreering tehtud.')}catch(e){toast(e.message,true)}}
async function cancelReg(id){if(!confirm('Kas tühistada registreering?'))return;try{await rpc('wod_cancel_registration',{p_training_id:id});await loadData();S.selected=null;render();toast('Registreering tühistatud.')}catch(e){toast(e.message,true)}}
function mineView(){const list=S.trainings.filter(t=>mine(t)&&new Date(t.starts_at)>new Date());return `<div class="content"><div class="section" style="margin-top:2px"><h2>Minu treeningud</h2></div><div class="stack">${list.length?list.map(card).join(''):'<div class="card empty">Registreeringuid pole.</div>'}</div></div>`}
function profileView(){return `<div class="content"><div class="card" style="padding:17px"><div style="display:flex;gap:12px;align-items:center"><div class="avatar" style="width:58px;height:58px">${esc(initials(S.profile.display_name))}</div><div><h2 style="margin:0">${esc(S.profile.display_name)}</h2><div class="meta">${esc(S.session.user.email||'')}</div></div></div><div class="grid" style="margin-top:14px"><div class="card box"><span>Treeningkordi alles</span><b>${S.wallet.credits||0}</b></div><div class="card box"><span>Roll</span><b style="font-size:17px">${isTrainer()?'Treener':'Klient'}</b></div></div></div><div class="section"><h2>Konto</h2></div><button class="btn danger block" onclick="logout()">Logi välja</button></div>`}
function trainerOverview(){const list=S.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());const t=list[0];return `<div class="content"><div class="hero"><small>TREENERI VAADE</small><h1>${t?esc(fmtDate(t.starts_at).full):'Lisa esimene treening'}</h1><p>${t?fmtTime(t.starts_at)+' · '+conf(t).length+'/'+t.capacity+' registreerunud':'Pärast avaldamist saavad kliendid registreeruda.'}</p></div><button class="btn primary block" onclick="go('add')">＋ Lisa treening</button><div class="section"><h2>Järgmised treeningud</h2></div><div class="stack">${list.length?list.map(t=>`<div onclick="openAtt(${t.id})">${card(t)}</div>`).join(''):'<div class="card empty">Treeninguid pole.</div>'}</div></div>`}
function trainerTrainings(){return trainerOverview()}
function openAtt(id){S.selected=id;S.view='attendees';render()}
function attendeesView(){const t=S.trainings.find(x=>x.id===S.selected);if(!t)return trainerOverview();return `<div class="content"><button class="btn secondary" onclick="go('overview')">‹ Tagasi</button><div class="section"><h2>${esc(fmtDate(t.starts_at).full)}</h2></div><div class="card">${conf(t).length?conf(t).map(r=>`<div class="listrow"><div class="avatar">${esc(initials(pname(r.user_id)))}</div><div class="grow"><b>${esc(pname(r.user_id))}</b><span>${esc(r.payment_status)}</span></div></div>`).join(''):'<div class="empty">Osalejaid pole.</div>'}</div></div>`}
function addView(){const d=new Date(Date.now()+86400000).toISOString().slice(0,10);return `<div class="content"><button class="btn secondary" onclick="go('overview')">‹ Tagasi</button><div class="card" style="padding:16px;margin-top:12px"><div class="section" style="margin-top:0"><h2>Lisa treening</h2></div><div class="two"><div class="field"><label>Kuupäev</label><input id="fd" type="date" value="${d}"></div><div class="field"><label>Kellaaeg</label><input id="ft" type="time" value="18:30"></div></div><div class="two"><div class="field"><label>Kestus</label><input id="fdu" type="number" value="60"></div><div class="field"><label>Kohti</label><input id="fc" type="number" value="12"></div></div><div class="field"><label>Nimetus</label><input id="fn" value="CrossFit"></div><div class="two"><div class="field"><label>Hind €</label><input id="fp" type="number" step="0.01" value="8"></div><div class="field"><label>Registreerimine lõppeb</label><input id="fr" type="time" value="16:00"></div></div><div class="field"><label>Märkus</label><textarea id="fno"></textarea></div><button class="btn primary block" onclick="createTraining()">Avalda treening</button></div></div>`}
function isoLocal(date,time){const x=new Date(date+'T'+time+':00');return x.toISOString()}
async function createTraining(){const v=id=>document.getElementById(id).value;try{const row={created_by:S.session.user.id,title:v('fn')||'CrossFit',starts_at:isoLocal(v('fd'),v('ft')),duration_minutes:+v('fdu')||60,capacity:+v('fc')||12,price_cents:Math.round((+v('fp')||0)*100),registration_closes_at:isoLocal(v('fd'),v('fr')||v('ft')),cancellation_hours:4,note:v('fno')||null,status:'published'};await rest('wod_trainings',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(row)});await loadData();go('overview');toast('Treening avaldatud.')}catch(e){toast(e.message,true)}}
function membersView(){const ids=[...new Set(S.regs.filter(r=>r.status==='confirmed').map(r=>r.user_id))];return `<div class="content"><div class="section" style="margin-top:2px"><h2>Liikmed</h2></div><div class="card">${ids.length?ids.map(id=>`<div class="listrow"><div class="avatar">${esc(initials(pname(id)))}</div><div class="grow"><b>${esc(pname(id))}</b><span>${S.regs.filter(r=>r.user_id===id&&r.status==='confirmed').length} registreeringut</span></div></div>`).join(''):'<div class="empty">Liikmeid pole veel.</div>'}</div></div>`}
function statsView(){const t=S.trainings.filter(x=>x.status==='published'),counts=t.map(conf),sum=counts.reduce((a,b)=>a+b.length,0),avg=t.length?(sum/t.length).toFixed(1).replace('.',','):'0';return `<div class="content"><div class="section" style="margin-top:2px"><h2>Statistika</h2></div><div class="grid"><div class="card box"><span>Treeninguid</span><b>${t.length}</b></div><div class="card box"><span>Keskmine osalejate arv</span><b>${avg}</b></div><div class="card box"><span>Osalemisi kokku</span><b>${sum}</b></div><div class="card box"><span>Liikmeid</span><b>${new Set(S.regs.filter(r=>r.status==='confirmed').map(r=>r.user_id)).size}</b></div></div></div>`}
async function refreshData(){try{await loadData();render();toast('Andmed värskendatud.')}catch(e){toast(e.message,true)}}
function render(){if(S.loading){root.innerHTML='<div class="app"><div class="loader">WOD käivitub…</div></div>';return}if(!S.session){root.innerHTML=authView();return}let body;if(isTrainer()){if(!['overview','trainerTrainings','members','stats','attendees','add'].includes(S.view))S.view='overview';body=S.view==='overview'?trainerOverview():S.view==='trainerTrainings'?trainerTrainings():S.view==='members'?membersView():S.view==='stats'?statsView():S.view==='attendees'?attendeesView():addView()}else{if(!['trainings','mine','profile'].includes(S.view))S.view='trainings';body=S.view==='trainings'?trainingsView():S.view==='mine'?mineView():profileView()}root.innerHTML='<div class="app">'+top()+body+nav()+'</div>';if(typeof S.selected==='number'){const t=S.trainings.find(x=>x.id===S.selected);if(t)root.insertAdjacentHTML('beforeend',modal(t))}else if(typeof S.selected==='string'&&S.selected.startsWith('pay:')){const t=S.trainings.find(x=>x.id===+S.selected.split(':')[1]);if(t)root.insertAdjacentHTML('beforeend',payModal(t))}}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Viga: '+(e.reason?.message||e.reason),true)});
boot();
</script></body></html>
