<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101612"><title>WOD</title><style>
:root{--g:#119447;--g2:#0b7136;--bg:#f2f5f3;--card:#fff;--text:#152019;--muted:#6d7771;--line:#dce4df;--dark:#101612;--red:#b93b41}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:520px;min-height:100svh;margin:auto;background:var(--bg);position:relative}.top{position:sticky;top:0;z-index:10;background:var(--dark);color:#fff;padding:16px}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:21px}.brand small{display:block;color:#aeb8b2;font-size:11px}.name{font-size:12px;background:#26302b;padding:7px 10px;border-radius:999px}.content{padding:16px 16px 100px}.hero{background:linear-gradient(135deg,#111914,#1b2d21);color:#fff;border-radius:24px;padding:21px;margin-bottom:16px}.hero h1{margin:4px 0 8px;font-size:27px}.hero p{margin:0;color:#c6d0ca;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.stat{background:#ffffff12;border:1px solid #ffffff17;border-radius:15px;padding:11px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#cbd3cf}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:18px;margin:0}.link{border:0;background:none;color:var(--g2);font-weight:800}.stack{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px}.training{padding:15px;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.date{height:58px;border-radius:15px;background:#eaf6ee;display:grid;place-items:center;text-align:center;color:#0c7736;font-weight:900}.date b{font-size:22px;line-height:1}.date span{font-size:10px;text-transform:uppercase}.training h3{margin:0 0 4px;font-size:15px}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;margin-top:7px;border-radius:999px;padding:5px 8px;background:#edf7f0;color:#0b7735;font-size:11px;font-weight:800}.badge.wait{background:#fff4dd;color:#8a5b10}.badge.full{background:#fdebee;color:#9c3036}.arrow{width:34px;height:34px;border:0;border-radius:11px;background:#ecf6ef;color:var(--g2);font-size:22px}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:850}.primary{background:linear-gradient(#16a550,#0d873f);color:#fff}.secondary{background:#e9efeb;color:#26312b}.danger{background:#fdebed;color:var(--red)}.block{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav.client{grid-template-columns:repeat(3,1fr)}.nav.trainer{grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:8px 3px;border-radius:12px;color:#6c766f;font-size:10px;font-weight:800}.nav button.active{background:#eaf6ee;color:var(--g2)}.auth{min-height:100svh;background:linear-gradient(150deg,#0f1511,#1f2c24);padding:24px;display:flex;align-items:center}.authbox{width:100%;max-width:420px;margin:auto}.logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#24bd65,#087233);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:950}.auth h1{color:#fff;font-size:35px;margin:18px 0 4px}.auth>div>p{color:#c6cfca;margin:0 0 18px}.authcard{background:#fff;border-radius:24px;padding:17px}.tabs{display:flex;background:#edf1ef;border-radius:13px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #d4ded8;background:#fbfcfb;border-radius:13px;padding:12px;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:11px;border-radius:12px;background:#edf6ef;color:#31543d;font-size:12px;margin-bottom:10px}.notice.bad{background:#fff0f1;color:#81383c}.modalbg{position:fixed;inset:0;background:#08100bb2;z-index:40;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(520px,100%);max-height:91svh;overflow:auto;background:var(--bg);border-radius:25px 25px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}.modal h2{margin:4px 0}.close{float:right;border:0;background:#e5ebe7;width:36px;height:36px;border-radius:11px;font-size:20px}.people{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.person{background:#eef3f0;border-radius:999px;padding:6px 9px;font-size:12px}.divider{height:1px;background:var(--line);margin:15px 0}.listrow{display:flex;align-items:center;gap:10px;padding:13px 15px}.listrow+.listrow{border-top:1px solid var(--line)}.avatar{width:34px;height:34px;border-radius:50%;background:#dceee3;display:grid;place-items:center;font-size:11px;font-weight:900}.grow{flex:1}.grow b{display:block}.grow span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:14px}.box span{display:block;color:var(--muted);font-size:11px}.box b{font-size:23px}.empty{text-align:center;color:var(--muted);padding:32px 18px}.loader{padding:50px;text-align:center}.toast{position:fixed;z-index:90;left:50%;bottom:88px;transform:translateX(-50%);width:min(470px,calc(100% - 30px));padding:12px 14px;border-radius:13px;background:#14221a;color:#fff;font-size:13px}.toast.bad{background:#8b3035}@media(min-width:700px){body{padding:22px 0}.app{border-radius:26px;overflow:hidden;min-height:calc(100svh - 44px)}.nav{bottom:22px;border-radius:0 0 26px 26px}.modalbg{align-items:center}.modal{border-radius:25px;max-height:90svh}}
</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://aanxpugvehwtcwwpefwx.supabase.co',KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const root=document.getElementById('root');
let S={loading:true,session:null,profile:null,trainings:[],regs:[],profiles:[],wallet:{credits:0},view:'trainings',modal:null,auth:'login'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=c=>(+c/100).toFixed(2).replace('.',',')+' €';const me=()=>S.session?.user?.id;const trainer=()=>S.profile?.role==='trainer';
const dparts=x=>{let d=new Date(x);return{day:new Intl.DateTimeFormat('et-EE',{day:'2-digit'}).format(d),mon:new Intl.DateTimeFormat('et-EE',{month:'short'}).format(d).replace('.',''),full:new Intl.DateTimeFormat('et-EE',{weekday:'long',day:'numeric',month:'long'}).format(d),time:new Intl.DateTimeFormat('et-EE',{hour:'2-digit',minute:'2-digit'}).format(d)}};const regs=t=>S.regs.filter(r=>r.training_id===t.id&&r.status!=='cancelled');const conf=t=>regs(t).filter(r=>r.status==='confirmed');const wait=t=>regs(t).filter(r=>r.status==='waitlist');const mine=t=>regs(t).find(r=>r.user_id===me());const pname=id=>S.profiles.find(p=>p.user_id===id)?.display_name||'Kasutaja';
function toast(m,bad=false){let x=document.createElement('div');x.className='toast'+(bad?' bad':'');x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}function err(x){return x?.message||'Tekkis viga.'}
async function ensure(){let q=await sb.from('wod_profiles').select('*').eq('user_id',me()).maybeSingle();if(q.error)throw q.error;if(!q.data){let n=S.session.user.user_metadata?.display_name||S.session.user.email?.split('@')[0]||'Kasutaja';let r=await sb.rpc('wod_ensure_profile',{new_display_name:n});if(r.error)throw r.error;S.profile=r.data}else S.profile=q.data}
async function load(){let a=await Promise.all([sb.from('wod_trainings').select('*').order('starts_at'),sb.from('wod_registrations').select('*').neq('status','cancelled'),sb.from('wod_profiles').select('*').order('display_name'),sb.from('wod_wallets').select('credits').eq('user_id',me()).maybeSingle()]);for(let r of a)if(r.error)throw r.error;[S.trainings,S.regs,S.profiles]=a.slice(0,3).map(x=>x.data||[]);S.wallet=a[3].data||{credits:0};S.profile=S.profiles.find(p=>p.user_id===me())||S.profile}
async function boot(){try{let{data:{session}}=await sb.auth.getSession();S.session=session;if(session){await ensure();await load()}}catch(x){console.error(x)}S.loading=false;render()}
function top(){return `<div class="top"><div class="brand"><div><b>WOD</b><small>${trainer()?'Treener':'Treeningud'}</small></div><span class="name">${e(S.profile?.display_name||'')}</span></div></div>`}
function nav(){if(trainer())return `<div class="nav trainer">${[['overview','Ülevaade'],['trainerTrainings','Treeningud'],['members','Liikmed'],['stats','Statistika']].map(([v,n])=>`<button class="${S.view===v?'active':''}" onclick="go('${v}')">${n}</button>`).join('')}</div>`;return `<div class="nav client">${[['trainings','Treeningud'],['mine','Minu treeningud'],['profile','Profiil']].map(([v,n])=>`<button class="${S.view===v?'active':''}" onclick="go('${v}')">${n}</button>`).join('')}</div>`}
function go(v){S.view=v;S.modal=null;render();scrollTo(0,0)}
function auth(){return `<div class="auth"><div class="authbox"><div class="logo">W</div><h1>WOD</h1><p>CrossFit treeningutele registreerimine.</p><div class="authcard"><div class="tabs"><button class="${S.auth==='login'?'on':''}" onclick="S.auth='login';render()">Logi sisse</button><button class="${S.auth==='signup'?'on':''}" onclick="S.auth='signup';render()">Loo konto</button></div><div id="msg"></div>${S.auth==='signup'?'<div class="field"><label>Nimi</label><input id="nm"></div>':''}<div class="field"><label>E-post</label><input id="em" type="email"></div><div class="field"><label>Parool</label><input id="pw" type="password"></div><button class="btn primary block" onclick="authSubmit()">${S.auth==='login'?'Logi sisse':'Loo konto'}</button></div></div></div>`}
async function authSubmit(){let em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value,nm=document.getElementById('nm')?.value.trim(),m=document.getElementById('msg');if(!em||!pw||(S.auth==='signup'&&!nm)){m.innerHTML='<div class="notice bad">Täida kõik väljad.</div>';return}m.innerHTML='<div class="notice">Palun oota…</div>';try{let r=S.auth==='signup'?await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:nm},emailRedirectTo:location.href}}):await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;if(!r.data.session){m.innerHTML='<div class="notice">Konto loodud. Kinnita e-postis saadetud link.</div>';return}S.session=r.data.session;await ensure();await load();S.view=trainer()?'overview':'trainings';render()}catch(x){m.innerHTML='<div class="notice bad">'+e(err(x))+'</div>'}}
function tcard(t){let d=dparts(t.starts_at),c=conf(t).length,m=mine(t),b=m?.status==='confirmed'?'✓ Registreeritud':m?.status==='waitlist'?'Ootenimekirjas':c>=t.capacity?'Täis':'Vabu '+(t.capacity-c);return `<div class="card training"><div class="date"><b>${d.day}</b><span>${d.mon}</span></div><div><h3>${e(d.full)}</h3><div class="meta"><span>${d.time}</span><span>👥 ${c}/${t.capacity}</span><span>${euro(t.price_cents)}</span></div><span class="badge ${m?.status==='waitlist'?'wait':(!m&&c>=t.capacity?'full':'')}">${b}</span></div><button class="arrow" onclick="openT(${t.id})">›</button></div>`}
function clientTrainings(){let u=S.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date());return `<div class="content"><div class="hero"><small>TULEVASED TREENINGUD</small><h1>Vali trenn ja pane nimi kirja.</h1><p>Kõik grupiliikmed näevad registreerunute nimekirja.</p><div class="stats"><div class="stat"><b>${u.length}</b><span>tulevast trenni</span></div><div class="stat"><b>${u.filter(t=>mine(t)?.status==='confirmed').length}</b><span>oled kirjas</span></div></div></div><div class="section"><h2>Tulevased treeningud</h2><button class="link" onclick="refresh()">Värskenda</button></div>${u.length?'<div class="stack">'+u.map(tcard).join('')+'</div>':'<div class="card empty">Treeninguid pole veel lisatud.</div>'}</div>`}
function myTrainings(){let u=S.trainings.filter(t=>mine(t)&&new Date(t.starts_at)>new Date());return `<div class="content"><div class="section"><h2>Minu treeningud</h2></div>${u.length?'<div class="stack">'+u.map(tcard).join('')+'</div>':'<div class="card empty">Sa ei ole veel ühelegi tulevasele treeningule registreeritud.</div>'}</div>`}
function openT(id){S.modal=id;render()}function closeM(){S.modal=null;render()}
function modal(t){let d=dparts(t.starts_at),c=conf(t).length,m=mine(t),names=conf(t).map(r=>pname(r.user_id));return `<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal"><button class="close" onclick="closeM()">×</button><small>${e(t.title)}</small><h2>${e(d.full)}</h2><div class="meta">${d.time} · ${euro(t.price_cents)} · ${c}/${t.capacity} kohta</div><div class="divider"></div><b>Registreerunud (${names.length})</b><div class="people">${names.length?names.map(n=>`<span class="person">${e(n)}</span>`).join(''):'<span class="meta">Keegi pole veel registreerunud.</span>'}</div>${wait(t).length?`<div class="notice" style="margin-top:12px">Ootenimekiri: ${wait(t).map(r=>e(pname(r.user_id))).join(', ')}</div>`:''}${t.note?`<div class="notice" style="margin-top:12px">${e(t.note)}</div>`:''}<div class="divider"></div>${m?`<button class="btn danger block" onclick="cancelReg(${t.id})">Tühista registreering</button>`:`<button class="btn primary block" onclick="register(${t.id},false)">${c>=t.capacity?'Liitu ootenimekirjaga':'Registreeru'}</button>`}</div></div>`}
async function register(id,credit){try{let r=await sb.rpc('wod_register',{p_training_id:id,p_use_credit:credit});if(r.error)throw r.error;await load();S.modal=null;render();toast(r.data?.[0]?.registration_status==='waitlist'?'Lisatud ootenimekirja.':'Registreering kinnitatud.')}catch(x){toast(err(x),true)}}async function cancelReg(id){if(!confirm('Kas tühistada registreering?'))return;try{let r=await sb.rpc('wod_cancel_registration',{p_training_id:id});if(r.error)throw r.error;await load();S.modal=null;render();toast('Registreering tühistatud.')}catch(x){toast(err(x),true)}}
function profile(){return `<div class="content"><div class="card" style="padding:17px"><h2 style="margin:0">${e(S.profile.display_name)}</h2><div class="meta">${e(S.session.user.email||'')}</div><div class="grid" style="margin-top:14px"><div class="card box"><span>Treeningkordi alles</span><b>${S.wallet.credits||0}</b></div><div class="card box"><span>Roll</span><b style="font-size:17px">${trainer()?'Treener':'Klient'}</b></div></div></div><div class="section"><h2>Konto</h2></div><button class="btn danger block" onclick="logout()">Logi välja</button></div>`}
async function logout(){await sb.auth.signOut();S={...S,session:null,profile:null,trainings:[],regs:[],profiles:[],view:'trainings'};render()}
function overview(){let u=S.trainings.filter(t=>t.status==='published'&&new Date(t.starts_at)>new Date()),t=u[0];return `<div class="content"><div class="hero"><small>TREENERI VAADE</small><h1>${t?e(dparts(t.starts_at).full):'Lisa esimene treening'}</h1><p>${t?`${dparts(t.starts_at).time} · ${conf(t).length}/${t.capacity} registreerunud`:'Pärast avaldamist saavad grupiliikmed registreeruda.'}</p></div><button class="btn primary block" onclick="go('add')">＋ Lisa treening</button><div class="section"><h2>Järgmised treeningud</h2></div>${u.length?'<div class="stack">'+u.map(tcard).join('')+'</div>':'<div class="card empty">Treeninguid pole.</div>'}</div>`}
function trainerTrainings(){let u=S.trainings.filter(t=>new Date(t.starts_at)>new Date(Date.now()-86400000));return `<div class="content"><div class="section"><h2>Treeningud</h2><button class="link" onclick="go('add')">＋ Lisa</button></div>${u.length?'<div class="stack">'+u.map(tcard).join('')+'</div>':'<div class="card empty">Treeninguid pole.</div>'}</div>`}
function add(){let d=new Date(Date.now()+86400000).toISOString().slice(0,10);return `<div class="content"><button class="btn secondary" onclick="go('overview')">‹ Tagasi</button><div class="section"><h2>Lisa treening</h2></div><div class="card" style="padding:16px"><div class="two"><div class="field"><label>Kuupäev</label><input id="fd" type="date" value="${d}"></div><div class="field"><label>Kell</label><input id="ft" type="time" value="18:30"></div></div><div class="two"><div class="field"><label>Kestus</label><input id="dur" type="number" value="60"></div><div class="field"><label>Kohti</label><input id="cap" type="number" value="12"></div></div><div class="field"><label>Nimi</label><input id="title" value="CrossFit"></div><div class="two"><div class="field"><label>Hind €</label><input id="price" type="number" step="0.01" value="8"></div><div class="field"><label>Reg lõpp</label><input id="rc" type="time" value="16:00"></div></div><div class="field"><label>Tühistamine</label><select id="can"><option value="2">2 h enne</option><option value="4" selected>4 h enne</option><option value="6">6 h enne</option></select></div><div class="field"><label>Märkus</label><textarea id="note"></textarea></div><button class="btn primary block" onclick="createT()">Avalda treening</button></div></div>`}
function iso(d,t){return new Date(d+'T'+t+':00+03:00').toISOString()}async function createT(){let v=id=>document.getElementById(id).value,d=v('fd'),t=v('ft');try{let r=await sb.from('wod_trainings').insert({created_by:me(),title:v('title')||'CrossFit',starts_at:iso(d,t),duration_minutes:+v('dur')||60,capacity:+v('cap')||12,price_cents:Math.round((+v('price')||0)*100),registration_closes_at:iso(d,v('rc')||t),cancellation_hours:+v('can')||4,note:v('note')||null,status:'published'});if(r.error)throw r.error;await load();S.view='trainerTrainings';render();toast('Treening avaldatud.')}catch(x){toast(err(x),true)}}
function members(){let ids=[...new Set(S.regs.map(r=>r.user_id))];return `<div class="content"><div class="section"><h2>Liikmed</h2></div><div class="card">${ids.length?ids.map(id=>`<div class="listrow"><div class="avatar">${e(pname(id).split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div class="grow"><b>${e(pname(id))}</b><span>${S.regs.filter(r=>r.user_id===id&&r.status==='confirmed').length} registreeringut</span></div></div>`).join(''):'<div class="empty">Liikmeid pole veel.</div>'}</div></div>`}
function stats(){let ts=S.trainings.filter(t=>t.status==='published'),nums=ts.map(conf),counts=nums.map(x=>x.length),sum=counts.reduce((a,b)=>a+b,0),avg=counts.length?(sum/counts.length).toFixed(1).replace('.',','):'0';return `<div class="content"><div class="section"><h2>Statistika</h2></div><div class="grid"><div class="card box"><span>Treeninguid</span><b>${ts.length}</b></div><div class="card box"><span>Keskmine osalejaid</span><b>${avg}</b></div><div class="card box"><span>Osalemisi kokku</span><b>${sum}</b></div><div class="card box"><span>Liikmeid</span><b>${new Set(S.regs.map(r=>r.user_id)).size}</b></div></div></div>`}
async function refresh(){try{await load();render();toast('Andmed värskendatud.')}catch(x){toast(err(x),true)}}
function render(){if(S.loading){root.innerHTML='<div class="app"><div class="loader">WOD laadib…</div></div>';return}if(!S.session){root.innerHTML=auth();return}if(trainer()&&!['overview','trainerTrainings','members','stats','add'].includes(S.view))S.view='overview';if(!trainer()&&!['trainings','mine','profile'].includes(S.view))S.view='trainings';let body=trainer()?(S.view==='overview'?overview():S.view==='trainerTrainings'?trainerTrainings():S.view==='members'?members():S.view==='stats'?stats():add()):(S.view==='trainings'?clientTrainings():S.view==='mine'?myTrainings():profile());root.innerHTML=`<div class="app">${top()}${body}${nav()}</div>`;if(typeof S.modal==='number'){let t=S.trainings.find(x=>x.id===S.modal);if(t)root.insertAdjacentHTML('beforeend',modal(t))}}
sb.auth.onAuthStateChange(async(ev,session)=>{if(ev==='SIGNED_OUT'){S.session=null;S.loading=false;render();return}if(session&&['SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(ev)){try{S.session=session;await ensure();await load();S.loading=false;render()}catch(x){console.error(x)}}});boot();
</script></body></html>
