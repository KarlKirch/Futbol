<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d94a32">
<meta name="application-name" content="CrossFit">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>CrossFit</title>
<link rel="manifest" href="./crossfit.webmanifest?v=4">
<link rel="icon" href="./crossfit-icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="./crossfit-icon.svg?v=3">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9eeeb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#appFrame{display:block;width:100%;height:100dvh;border:0;background:#e9eeeb}.hidden{display:none!important}.cal-bg{position:fixed;inset:0;z-index:200;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}.cal{width:min(390px,100%);background:#fff;border-radius:22px;padding:16px;box-shadow:0 20px 65px #0005;color:#152019}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cal-title{font-weight:900;text-transform:capitalize}.nav{width:40px;height:40px;border:1px solid #dce4df;border-radius:12px;background:#fff;font-size:21px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;padding:5px 0;font-size:11px;font-weight:900;color:#6d7771}.day,.blank{aspect-ratio:1}.day{border:0;border-radius:11px;background:#f3f6f4;font-weight:750}.day.today{outline:1px solid #83c99e}.day.sel{background:#d94a32;color:#fff}.foot{display:flex;gap:8px;margin-top:12px}.foot button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:800}.todaybtn{background:#edf1ef}.closebtn{background:#101612;color:#fff}
</style>
</head>
<body>
<iframe id="appFrame" src="./index.html?v=12" title="CrossFit"></iframe>
<div id="calBg" class="cal-bg hidden" onclick="closeCal(event)"><div class="cal" onclick="event.stopPropagation()"><div id="calBody"></div></div></div>
<script>
'use strict';
const frame=document.getElementById('appFrame'),calBg=document.getElementById('calBg'),calBody=document.getElementById('calBody');
const SUPABASE_URL='https://aanxpugvehwtcwwpefwx.supabase.co';
const SUPABASE_KEY='sb_publishable_ICMR8EF0LK69VjfVRWe0ew_120LIV7A';
const CROSSFIT_VAPID_PUBLIC='BJYpdEsob-TJHXH5cn27pxwAgHZRVKTetdZraQO5LVmcwQYUzkYR3bQ0wc57jxlxWajOTYfOfanDlWJmTI-cRzY';
let installPrompt=null,targetInput=null,cursor=null,patchTimer=null,pushBusy=false,pushStatusCheckedAt=0;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;patchChild()});
window.addEventListener('appinstalled',()=>{installPrompt=null;patchChild()});
async function installCrossfit(){
  if(isStandalone())return;
  if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;patchChild();return}
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  alert(isIOS?'Vajuta brauseris Jaga ja vali „Lisa avakuvale“.':'Ava see leht Chrome’is ja vajuta „Lisa CrossFit avakuvale“.');
}
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Tallinn',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return`${o.year}-${o.month}-${o.day}`}
function monDay(s){const[y,m,d]=s.split('-').map(Number),n=new Date(Date.UTC(y,m-1,d)).getUTCDay();return n===0?7:n}
function openCal(input){targetInput=input;const base=input.value||today(),[y,m]=base.split('-').map(Number);cursor={y,m};renderCal();calBg.classList.remove('hidden')}
function closeCal(e){if(e&&e.target!==calBg)return;calBg.classList.add('hidden');targetInput=null}
function moveCal(n){let{y,m}=cursor;m+=n;if(m<1){m=12;y--}if(m>12){m=1;m=1;y++}cursor={y,m};renderCal()}
function pick(s){if(targetInput){targetInput.value=s;targetInput.dispatchEvent(new Event('input',{bubbles:true}));targetInput.dispatchEvent(new Event('change',{bubbles:true}))}closeCal()}
function renderCal(){const{y,m}=cursor,first=`${y}-${String(m).padStart(2,'0')}-01`,lead=monDay(first)-1,max=new Date(Date.UTC(y,m,0)).getUTCDate(),sel=targetInput?.value||'',now=today(),title=new Intl.DateTimeFormat('et-EE',{timeZone:'UTC',month:'long',year:'numeric'}).format(new Date(Date.UTC(y,m-1,1)));let cells='';for(let i=0;i<lead;i++)cells+='<div class="blank"></div>';for(let d=1;d<=max;d++){const s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day${s===now?' today':''}${s===sel?' sel':''}" onclick="pick('${s}')">${d}</button>`}calBody.innerHTML=`<div class="cal-head"><button class="nav" onclick="moveCal(-1)">‹</button><div class="cal-title">${title}</div><button class="nav" onclick="moveCal(1)">›</button></div><div class="grid">${['E','T','K','N','R','L','P'].map(x=>`<div class="wd">${x}</div>`).join('')}${cells}</div><div class="foot"><button class="todaybtn" onclick="pick(today())">Täna</button><button class="closebtn" onclick="closeCal()">Sulge</button></div>`}
function roundEuro(input){if(!input)return;const v=Number(String(input.value).replace(',','.'));if(Number.isFinite(v))input.value=String(Math.max(0,Math.round(v)))}
function patchDate(input){if(!input||input.dataset.monCalendar)return;input.dataset.monCalendar='1';input.type='text';input.readOnly=true;input.inputMode='none';input.style.cursor='pointer';input.addEventListener('click',e=>{e.preventDefault();openCal(input)})}
function patchPrice(input,isCreate=false){if(!input||input.dataset.euroStep)return;input.dataset.euroStep='1';input.step='1';input.min='0';input.inputMode='numeric';if(isCreate&&(input.value==='8'||input.value==='8.00'||input.value===''))input.value='5';else roundEuro(input);input.addEventListener('change',()=>roundEuro(input));input.addEventListener('blur',()=>roundEuro(input))}
function patchBranding(d){d.title='CrossFit';const logo=d.querySelector('#authScreen .logo');if(logo&&logo.textContent!=='CF')logo.textContent='CF';const authTitle=d.querySelector('#authScreen h1');if(authTitle&&authTitle.textContent!=='CrossFit')authTitle.textContent='CrossFit';const topTitle=d.querySelector('#mainScreen .top b');if(topTitle&&topTitle.textContent!=='CrossFit')topTitle.textContent='CrossFit'}
function ensureInstallStyle(d){if(d.getElementById('crossfitInstallStyle'))return;const s=d.createElement('style');s.id='crossfitInstallStyle';s.textContent='.crossfit-install-card,.crossfit-push-card{padding:14px;margin:0 0 16px;border:1px solid #ead6d0;border-radius:16px;background:#fff;box-shadow:0 5px 20px rgba(20,40,28,.07)}.crossfit-install-title,.crossfit-push-title{font-size:14px;font-weight:900}.crossfit-install-text,.crossfit-push-text{margin-top:4px;color:#6d7771;font-size:12px;line-height:1.45}.crossfit-install-btn,.crossfit-push-btn{margin-top:10px;min-height:42px;padding:0 14px;border:0;border-radius:11px;background:#d94a32;color:#fff;font-weight:900}.crossfit-push-btn.off{background:#edf1ef;color:#26312b}.crossfit-push-status{display:inline-flex;margin-top:8px;padding:5px 9px;border-radius:999px;background:#edf1ef;color:#536159;font-size:11px;font-weight:850}.crossfit-push-status.on{background:#e7f7ed;color:#11683a}.crossfit-push-status.bad{background:#fdebed;color:#9c3038}';d.head.appendChild(s)}
function injectInstallCard(d){const old=d.getElementById('crossfitInstallCard');if(isStandalone()){old?.remove();return}ensureInstallStyle(d);if(old)return;const card=d.createElement('div');card.id='crossfitInstallCard';card.className='crossfit-install-card';card.innerHTML='<div class="crossfit-install-title">Lisa CrossFit avakuvale</div><div class="crossfit-install-text">CrossFit paigaldatakse Futbolist eraldi rakendusena ja seda saab eraldi tegumiribale kinnitada.</div><button class="crossfit-install-btn" type="button">Lisa CrossFit avakuvale</button>';card.querySelector('button').addEventListener('click',()=>installCrossfit());const main=d.querySelector('#mainScreen .content');const hero=main?.querySelector('.hero');if(main){hero?hero.insertAdjacentElement('afterend',card):main.prepend(card);return}const authbox=d.querySelector('#authScreen .authbox');if(authbox)authbox.appendChild(card)}
function getWodSession(){try{return JSON.parse(localStorage.getItem('wod_session')||'null')}catch(_){return null}}
function pushSupported(){return 'serviceWorker'in navigator&&'PushManager'in window&&typeof Notification!=='undefined'}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function wodRegistration(){let reg=await navigator.serviceWorker.getRegistration('./');if(!reg)reg=await navigator.serviceWorker.register('./sw.js?v=7',{scope:'./',updateViaCache:'none'});await reg.update().catch(()=>{});return reg}
async function wodPushRequest(path,opt={}){const session=getWodSession();if(!session?.access_token||!session?.user?.id)throw new Error('Logi enne CrossFiti sisse.');const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers});if(!r.ok){const text=await r.text();throw new Error(text||('HTTP '+r.status))}return r}
async function storePushSubscription(subscription){const session=getWodSession(),json=subscription.toJSON();await wodPushRequest('wod_push_subscriptions?on_conflict=endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:session.user.id,endpoint:subscription.endpoint,p256dh:json.keys?.p256dh||'',auth:json.keys?.auth||'',updated_at:new Date().toISOString()})})}
function setPushCardState(d,state,message){const card=d.getElementById('crossfitPushCard');if(!card)return;const status=card.querySelector('.crossfit-push-status'),btn=card.querySelector('.crossfit-push-btn');status.textContent=message||'';status.className='crossfit-push-status'+(state==='on'?' on':state==='bad'?' bad':'');btn.textContent=state==='on'?'Lülita teavitused välja':'Luba teavitused';btn.className='crossfit-push-btn'+(state==='on'?' off':'');btn.dataset.enabled=state==='on'?'1':'0';btn.disabled=pushBusy}
async function refreshPushState(d,force=false){if(!d?.getElementById('crossfitPushCard'))return;if(!force&&Date.now()-pushStatusCheckedAt<10000)return;pushStatusCheckedAt=Date.now();if(!pushSupported()){setPushCardState(d,'bad','See brauser ei toeta push-teavitusi.');return}if(Notification.permission==='denied'){setPushCardState(d,'bad','Teavitused on brauseris blokeeritud.');return}try{const reg=await wodRegistration(),sub=await reg.pushManager.getSubscription();if(sub&&Notification.permission==='granted')setPushCardState(d,'on','Teavitused on lubatud');else setPushCardState(d,'off','Teavitused ei ole veel lubatud')}catch(_){setPushCardState(d,'off','Teavitused ei ole veel lubatud')}}
async function enablePush(d){if(pushBusy)return;pushBusy=true;setPushCardState(d,'off','Lülitan teavitusi sisse…');try{const session=getWodSession();if(!session?.access_token||!session?.user?.id)throw new Error('Logi enne CrossFiti sisse.');if(!pushSupported())throw new Error('See brauser ei toeta push-teavitusi.');const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error(permission==='denied'?'Teavitused on brauseris blokeeritud.':'Teavituste luba ei antud.');const reg=await wodRegistration();let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(CROSSFIT_VAPID_PUBLIC)});await storePushSubscription(sub);pushStatusCheckedAt=0;setPushCardState(d,'on','Teavitused on lubatud')}catch(e){setPushCardState(d,'bad',e.message||'Teavituste lubamine ebaõnnestus.')}finally{pushBusy=false;const btn=d.getElementById('crossfitPushCard')?.querySelector('.crossfit-push-btn');if(btn)btn.disabled=false}}
async function disablePush(d){if(pushBusy)return;pushBusy=true;try{const reg=await wodRegistration(),sub=await reg.pushManager.getSubscription();if(sub){await wodPushRequest('wod_push_subscriptions?endpoint=eq.'+encodeURIComponent(sub.endpoint),{method:'DELETE'}).catch(()=>{});await sub.unsubscribe()}pushStatusCheckedAt=0;setPushCardState(d,'off','Teavitused on välja lülitatud')}catch(e){setPushCardState(d,'bad',e.message||'Teavituste väljalülitamine ebaõnnestus.')}finally{pushBusy=false;const btn=d.getElementById('crossfitPushCard')?.querySelector('.crossfit-push-btn');if(btn)btn.disabled=false}}
async function togglePush(d){const btn=d.getElementById('crossfitPushCard')?.querySelector('.crossfit-push-btn');if(btn?.dataset.enabled==='1')await disablePush(d);else await enablePush(d)}
function injectPushCard(d){const main=d.querySelector('#mainScreen .content');if(!main)return;ensureInstallStyle(d);let card=d.getElementById('crossfitPushCard');if(!card){card=d.createElement('div');card.id='crossfitPushCard';card.className='crossfit-push-card';card.innerHTML='<div class="crossfit-push-title">Teavitused</div><div class="crossfit-push-text">Saad teate päev enne registreeritud trenni, ootenimekirjast koha saamisel ning siis, kui treening tühistatakse või selle aeg muutub. Treener saab teate ka täitunud trennist.</div><div class="crossfit-push-status">Kontrollin…</div><br><button class="crossfit-push-btn" type="button">Luba teavitused</button>';card.querySelector('button').addEventListener('click',()=>togglePush(d));const install=d.getElementById('crossfitInstallCard'),hero=main.querySelector('.hero');if(install)install.insertAdjacentElement('afterend',card);else if(hero)hero.insertAdjacentElement('afterend',card);else main.prepend(card)}refreshPushState(d)}
function patchChild(){let d;try{d=frame.contentDocument}catch(_){return}if(!d?.body)return;patchBranding(d);const t=d.getElementById('ttime');if(t&&!t.dataset.default1900){t.dataset.default1900='1';if(t.value==='18:30'||!t.value)t.value='19:00'}patchPrice(d.getElementById('tprice'),true);patchPrice(d.getElementById('eprice'),false);patchDate(d.getElementById('tdate'));patchDate(d.getElementById('edate'));injectInstallCard(d);injectPushCard(d);if(!d.documentElement.dataset.crossfitCapture){d.documentElement.dataset.crossfitCapture='1';d.addEventListener('click',e=>{const b=e.target.closest?.('button');if(!b)return;const code=b.getAttribute('onclick')||'';if(code.includes('createTraining'))roundEuro(d.getElementById('tprice'));if(code.includes('saveTraining'))roundEuro(d.getElementById('eprice'))},true)}}
function initFrame(){patchChild();if(patchTimer)clearInterval(patchTimer);patchTimer=setInterval(patchChild,1000)}
frame.addEventListener('load',initFrame);
window.installCrossfit=installCrossfit;window.closeCal=closeCal;window.moveCal=moveCal;window.pick=pick;window.today=today;
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=7',{scope:'./',updateViaCache:'none'}).catch(()=>{}));
</script>
</body>
