name: Enhance Futbol UI

on:
  push:
    paths:
      - ".github/workflows/enhance-futbol.yml"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add player summary and share button
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css_anchor = """    .match-header {\n"""
          css_insert = """    .player-summary {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 8px;\n      margin-bottom: 14px;\n    }\n\n    .summary-stat {\n      background: var(--card);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 12px 8px;\n      text-align: center;\n      box-shadow: var(--shadow);\n    }\n\n    .summary-value {\n      display: block;\n      font-size: 22px;\n      line-height: 1.1;\n      font-weight: 950;\n      color: var(--green);\n    }\n\n    .summary-label {\n      display: block;\n      margin-top: 4px;\n      font-size: 11px;\n      color: var(--muted);\n      font-weight: 700;\n    }\n\n    .share-card {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      padding: 12px 14px;\n      margin-bottom: 14px;\n      background: var(--dark);\n      color: white;\n      border-radius: 16px;\n      box-shadow: var(--shadow);\n    }\n\n    .share-card-text {\n      min-width: 0;\n    }\n\n    .share-card-title {\n      font-weight: 900;\n      font-size: 14px;\n    }\n\n    .share-card-subtitle {\n      margin-top: 2px;\n      color: #cddbd2;\n      font-size: 11px;\n    }\n\n    .share-btn {\n      flex: 0 0 auto;\n      min-height: 42px;\n      padding: 0 14px;\n      border: 1px solid rgba(255,255,255,.2);\n      border-radius: 11px;\n      background: white;\n      color: var(--dark);\n      font-weight: 900;\n    }\n\n"""
          if ".player-summary {" not in text:
              if css_anchor not in text:
                  raise SystemExit("CSS anchor not found")
              text = text.replace(css_anchor, css_insert + css_anchor, 1)

          html_anchor = """    <section id=\"tab-games\">\n      <h2>Mängud</h2>\n      <div id=\"games\"></div>\n    </section>"""
          html_replacement = """    <section id=\"tab-games\">\n      <h2>Mängud</h2>\n      <div id=\"playerSummary\"></div>\n      <div id=\"games\"></div>\n    </section>"""
          if 'id="playerSummary"' not in text:
              if html_anchor not in text:
                  raise SystemExit("Games section anchor not found")
              text = text.replace(html_anchor, html_replacement, 1)

          load_anchor = """  renderGames();\n  renderLeaderboard();\n\n  if (adminVerified) {"""
          load_replacement = """  renderPlayerSummary();\n  renderGames();\n  renderLeaderboard();\n\n  if (adminVerified) {"""
          if "renderPlayerSummary();" not in text:
              if load_anchor not in text:
                  raise SystemExit("loadAll anchor not found")
              text = text.replace(load_anchor, load_replacement, 1)

          js_anchor = """function renderGames() {\n"""
          js_insert = r'''function renderPlayerSummary() {

  const container =
    document.getElementById("playerSummary");

  if (!container || !currentUser) {
    return;
  }

  const row =
    leaderboard.find(
      item => item.player_id === currentUser.id
    );

  const points =
    row ? Number(row.total_points || 0) : 0;

  const rank =
    row ? row.rank_no : "–";

  const exact =
    row ? Number(row.exact_scores || 0) : 0;

  container.innerHTML =
    '<div class="player-summary">' +
      '<div class="summary-stat">' +
        '<span class="summary-value">' + points + '</span>' +
        '<span class="summary-label">Minu punktid</span>' +
      '</div>' +
      '<div class="summary-stat">' +
        '<span class="summary-value">' + rank + '</span>' +
        '<span class="summary-label">Koht tabelis</span>' +
      '</div>' +
      '<div class="summary-stat">' +
        '<span class="summary-value">' + exact + '</span>' +
        '<span class="summary-label">Täpsed skoorid</span>' +
      '</div>' +
    '</div>' +
    '<div class="share-card">' +
      '<div class="share-card-text">' +
        '<div class="share-card-title">Kutsu sõbrad ennustama</div>' +
        '<div class="share-card-subtitle">Jaga Futboli linki otse telefonist</div>' +
      '</div>' +
      '<button class="share-btn" onclick="shareFutbol()">Jaga</button>' +
    '</div>';
}

async function shareFutbol() {

  const shareData = {
    title: "Futbol",
    text: "Tule ennusta meiega jalgpallimängude skoore!",
    url: window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
      return;
    }

    if (navigator.clipboard) {
      await navigator.clipboard.writeText(window.location.href);
      toast("Futboli link kopeeritud.");
      return;
    }

    window.prompt(
      "Kopeeri Futboli link:",
      window.location.href
    );
  } catch (error) {
    if (error && error.name === "AbortError") {
      return;
    }

    toast("Lingi jagamine ebaõnnestus.");
  }
}

'''
          if "function renderPlayerSummary()" not in text:
              if js_anchor not in text:
                  raise SystemExit("renderGames anchor not found")
              text = text.replace(js_anchor, js_insert + js_anchor, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add player summary and share button"
            git push
          fi
