name: Enhance Futbol UI

on:
  push:
    paths:
      - ".github/workflows/enhance-futbol.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply base UI enhancements
        run: python enhance_futbol.py

      - name: Add calendar picker
        run: python add_calendar_picker.py

      - name: Add quick-share apps
        run: python add_share_apps.py

      - name: Fix stale anonymous sessions
        run: python fix_stale_auth.py

      - name: Add core UX improvements
        run: python run_core_ux.py

      - name: Add competition UX improvements
        run: python add_competition_ux.py

      - name: Add Champions League features
        run: python add_champions_features.py

      - name: Add custom recovery code UI
        run: python custom_recovery_code.py

      - name: Move recovery settings to rules
        run: python move_recovery_to_rules.py

      - name: Add UCL rounds logos and import UI
        run: python add_ucl_advanced_features.py

      - name: Fix UCL sync error handling
        run: python fix_ucl_sync_ui.py

      - name: Add curated UCL match selection and history
        run: python add_curated_round_selection.py

      - name: Group matches by day and simplify admin
        run: python refine_round_day_ui.py

      - name: Group matches by kickoff time
        run: python group_ucl_by_time.py

      - name: Add competition leaderboard and reminder UX
        run: python add_competition_plus_features.py

      - name: Add gap to leader in leaderboard
        run: python add_leader_gap.py

      - name: Add dynamic round columns to leaderboard
        run: python dynamic_round_leaderboard.py

      - name: Add paid entry and bank transfer UI
        run: python add_paid_entry.py

      - name: Add user chat
        run: python add_chat_feature.py

      - name: Fix chat startup
        run: python fix_chat_boot.py

      - name: Isolate chat from core startup
        run: python isolate_chat_startup.py

      - name: Add multi-device accounts and entry rules
        run: python add_multi_device_accounts.py

      - name: Move confirmed payment status to rules
        run: python move_paid_status_to_rules.py

      - name: Add prize split and clearer chat names
        run: python update_prizes_chat_names.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chat.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add prize split and clearer chat names"
            git push
          fi

# Refresh: prize split and chat author emphasis
