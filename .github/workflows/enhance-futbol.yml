name: Enhance Futbol UI

on:
  push:
    paths:
      - ".github/workflows/enhance-futbol.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply base UI enhancements
        run: python enhance_futbol.py

      - name: Add calendar picker
        run: python add_calendar_picker.py

      - name: Add quick-share apps
        run: python add_share_apps.py

      - name: Fix stale anonymous sessions
        run: python fix_stale_auth.py

      - name: Add core UX improvements
        run: python run_core_ux.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add rules countdown and grouped matches"
            git push
          fi

# Refresh: core UX runner syntax fixed
