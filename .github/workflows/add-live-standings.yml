name: Add live standings

on:
  push:
    paths:
      - 'add_live_standings.py'
      - '.github/workflows/add-live-standings.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply live standings wiring
        run: python add_live_standings.py
      - name: Verify live standings wiring
        run: |
          grep -q 'live-standings.css?v=1' index.html
          grep -q 'live-standings.js?v=1' index.html
          grep -q 'futbol-champions-v12' sw.js
          grep -q 'live-standings.js?v=1' sw.js
      - name: Commit focused changes
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Enable live leaderboard'
          git push
