name: Wire admin session

on:
  push:
    paths:
      - 'admin-session.js'
      - 'wire_admin_session.py'
      - '.github/workflows/wire-admin-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire admin session helper
        run: python wire_admin_session.py
      - name: Verify wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert index.count('<script src="./admin-session.js?v=1"></script>') == 1
          assert sw.count('"./admin-session.js?v=1"') == 1
          assert 'futbol-champions-v14' in sw
          assert 'const WOD_PATH' in sw
          PY
      - name: Commit focused changes
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Enable persistent admin session'
          git push
