name: Refine lineup button

on:
  push:
    paths:
      - ".github/workflows/refine-lineup-button.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-lineup-button:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refine lineup button UX
        run: python refine_lineup_button.py

      - name: Verify lineup integration
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '/* FUTBOL LINEUP BUTTON UX V2 */' in text
          assert '<summary>Koosseis</summary>' in text
          assert "const eventsMarker = '<details class=\"live-events\">';" in text
          assert "sb.functions.invoke('ucl-lineups'" in text
          print('Lineup button refinement verified')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Refine lineup button UX"
            git push
          fi
