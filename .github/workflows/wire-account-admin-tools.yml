name: Wire account admin tools

on:
  push:
    paths:
      - 'account-admin-tools.js'
      - 'wire_account_admin_tools.py'
      - '.github/workflows/wire-account-admin-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire account and admin tools
        run: python wire_account_admin_tools.py
      - name: Verify wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert index.count('<script src="./account-admin-tools.js?v=1"></script>') == 1
          assert sw.count('"./account-admin-tools.js?v=1"') == 1
          assert 'futbol-champions-v15' in sw
          assert 'const WOD_PATH' in sw
          assert index.count('<script src="./chat.js?v=9"></script>') == 1
          PY
      - name: Commit focused changes
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Enable account switching and admin prediction list'
          git push
